<!doctype html><meta charset="utf-8"><title>Notes</title>
<h1>Notes</h1><form id="f"><input id="t" placeholder="note" required><button>Add</button></form><ul id="l"></ul>
<script>
const load=async()=>{const r=await fetch('/api/notes');l.replaceChildren(...(await r.json()).map(n=>{const li=document.createElement('li');li.textContent=n.text;return li}))};
f.onsubmit=async e=>{e.preventDefault();await fetch('/api/notes',{method:'POST',body:JSON.stringify({text:t.value})});t.value='';load()};load();
</script>
