# Throwaway benchmark gateway: every proxied location is meant to be public. `internal` would block the test traffic, so the
# missing-internal rule is suppressed per line.
resolver 127.0.0.11 valid=5s ipv6=off;
server {
  listen 80;
  location /api/products      { set $u http://catalog:3000;       proxy_pass $u; }  # nosemgrep: generic.nginx.security.missing-internal.missing-internal
  location /api/orders        { set $u http://orders:3000;        proxy_pass $u; }  # nosemgrep: generic.nginx.security.missing-internal.missing-internal
  location /api/payments      { set $u http://payments:3000;      proxy_pass $u; }  # nosemgrep: generic.nginx.security.missing-internal.missing-internal
  location /api/notifications { set $u http://notifications:3000; proxy_pass $u; }  # nosemgrep: generic.nginx.security.missing-internal.missing-internal
  location = /health          { default_type application/json; return 200 '{"ok":true,"service":"gateway"}'; }
  location = /health/storefront { set $u http://storefront:3000; rewrite ^ /health break; proxy_pass $u; }  # nosemgrep: generic.nginx.security.missing-internal.missing-internal
  location = /health/admin    { set $u http://admin:3000;         rewrite ^ /health break; proxy_pass $u; }  # nosemgrep: generic.nginx.security.missing-internal.missing-internal
  location /admin             { set $u http://admin:3000;         proxy_pass $u; }  # nosemgrep: generic.nginx.security.missing-internal.missing-internal
  location /                  { set $u http://storefront:3000;    proxy_pass $u; }  # nosemgrep: generic.nginx.security.missing-internal.missing-internal
}
