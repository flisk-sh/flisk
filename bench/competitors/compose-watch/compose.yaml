# The 10-part shop as Docker Compose with `develop.watch` (sync+restart on source edits). The app code is shared: bench/shop (BENCH_SHOP is set by the runner).
name: ${BENCH_PROJECT:-flisk-bench-compose-watch}

x-db: &db
  DATABASE_URL: postgres://shop:shop@postgres:5432/shop
x-queue: &queue
  REDIS_URL: redis://queue:6379

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: shop, POSTGRES_PASSWORD: shop, POSTGRES_DB: shop }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U shop -d shop"], interval: 2s, timeout: 3s, retries: 30 }

  queue:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 3s, retries: 30 }

  migrator:
    build: ${BENCH_SHOP}/db
    develop:
      watch:
        - { action: rebuild, path: "${BENCH_SHOP}/db/migrations" }
    restart: "no"
    environment: *db
    depends_on: { postgres: { condition: service_healthy } }

  catalog:
    build: ${BENCH_SHOP}/catalog
    develop:
      watch:
        - { action: sync+restart, path: "${BENCH_SHOP}/catalog/src", target: /app/src }
    environment: *db
    depends_on: { migrator: { condition: service_completed_successfully } }

  payments:
    build: ${BENCH_SHOP}/payments
    develop:
      watch:
        - { action: sync+restart, path: "${BENCH_SHOP}/payments/src", target: /app/src }
    environment: *db
    depends_on: { migrator: { condition: service_completed_successfully } }

  orders:
    build: ${BENCH_SHOP}/orders
    develop:
      watch:
        - { action: sync+restart, path: "${BENCH_SHOP}/orders/src", target: /app/src }
    environment:
      <<: [*db, *queue]
      CATALOG_URL: http://catalog:3000
      PAYMENTS_URL: http://payments:3000
    depends_on:
      migrator: { condition: service_completed_successfully }
      queue: { condition: service_healthy }
      catalog: { condition: service_started }
      payments: { condition: service_started }

  notifications:
    build: ${BENCH_SHOP}/notifications
    develop:
      watch:
        - { action: sync+restart, path: "${BENCH_SHOP}/notifications/src", target: /app/src }
    environment:
      <<: [*db, *queue]
    depends_on:
      migrator: { condition: service_completed_successfully }
      queue: { condition: service_healthy }

  fulfilment:
    build: ${BENCH_SHOP}/fulfilment
    develop:
      watch:
        - { action: sync+restart, path: "${BENCH_SHOP}/fulfilment/src", target: /app/src }
    environment:
      <<: *queue
      ORDERS_URL: http://orders:3000
      SHIP_DELAY_MS: "5000"
    depends_on:
      queue: { condition: service_healthy }
      orders: { condition: service_started }

  storefront:
    build: ${BENCH_SHOP}/storefront
    develop:
      watch:
        - { action: sync, path: "${BENCH_SHOP}/storefront/public", target: /app/public }
        - { action: sync+restart, path: "${BENCH_SHOP}/storefront/src", target: /app/src }

  admin:
    build: ${BENCH_SHOP}/admin
    develop:
      watch:
        - { action: sync, path: "${BENCH_SHOP}/admin/public", target: /app/public }
        - { action: sync+restart, path: "${BENCH_SHOP}/admin/src", target: /app/src }
    environment: { BASE_PATH: /admin }

  gateway:
    build: ${BENCH_SHOP}/gateway
    ports: ["${BENCH_PORT:-18700}:80"]
    depends_on: [storefront, admin, catalog, orders, payments, notifications]

volumes:
  pgdata:
