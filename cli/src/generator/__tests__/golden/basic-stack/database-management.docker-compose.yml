services:
  postgres:
    image: postgres:16-alpine
    container_name: basic_stack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: basic_stack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${TDK_BIND_ADDRESS:-127.0.0.1}:${TDK_POSTGRES_PORT:-15432}:5432"
    volumes:
      - basic_stack_postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basic_stack -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  database:
    name: basic_stack_database
    external: true

volumes:
  basic_stack_postgres_data:
