name: 🏷️ RELEASE | Image | Publish golden images

# Builds the eight golden layers from the Dockerfile that `flisk up` generates and pushes them to GitHub's registry
# (ghcr.io/flisk-sh/golden-<layer>:<hash12>) and to Docker Hub (docker.io/alexdykyi), the same image in both. `flisk up`
# pulls these from ghcr.io/flisk-sh by default and builds locally only when the pull fails, so the hash of every engine on
# main has to be published: this runs on each push to main that can change the golden Dockerfile, and skips a hash that is
# already in GHCR (it still signs and attests that hash when it has no signature yet). Run it by hand to republish. GHCR makes a new package private: after the first push of a NEW layer, an
# org owner sets that golden-* package to public in its package settings, or anonymous pulls fail and projects build locally.
on:
  push:
    branches: [main]
    # The generator (golden_image_dockerfile.star) loads helpers across the engine, any of which can change the text.
    paths:
      - runtime/engine/topologies/**
      - runtime/discovery/**
      - scripts/golden/**
      - .github/workflows/publish-golden-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-golden-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push ghcr.io/flisk-sh/golden-* with GITHUB_TOKEN
      id-token: write # keyless cosign signing and the provenance attestation (GitHub OIDC)
      attestations: write # attest-build-provenance stores the attestation for the images
    env:
      # Repository secrets: the Docker Hub user and an access token that can push to <namespace>/golden-*.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GHCR_REGISTRY: ghcr.io/flisk-sh
      # Docker Hub stays on the personal namespace until docker.io/flisk-sh exists; then switch this one line.
      DOCKERHUB_REGISTRY: docker.io/alexdykyi
    steps:
      - name: Stop when Docker Hub is not configured
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set to publish golden images."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
        # bun-version inherited from composite default (1.4.4)

      - uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Render the golden Dockerfile with the repository's generator
        run: bash scripts/golden/render-golden-dockerfile.sh "$RUNNER_TEMP/golden"

      # Read without a login, the way `flisk up` pulls. A push that did not change the rendered Dockerfile stops here.
      - name: Skip when this hash is already published
        id: published
        run: |
          if bash scripts/golden/golden-published.sh "$RUNNER_TEMP/golden" "$GHCR_REGISTRY"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.published.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.published.outputs.skip != 'true'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push the eight golden layers
        if: steps.published.outputs.skip != 'true'
        run: bash scripts/golden/push-golden-images.sh "$RUNNER_TEMP/golden" "$GHCR_REGISTRY" "$DOCKERHUB_REGISTRY"

      # Reads every pushed image back the way `flisk up` pulls it (GHCR without a login, so a private package fails here):
      # both platforms, a size within bounds, the hash label, and the same digest in both registries.
      - name: Verify the published golden images
        if: steps.published.outputs.skip != 'true'
        run: python3 -I scripts/golden/verify-golden-images.py "$RUNNER_TEMP/golden/golden-layers.Dockerfile" "$GHCR_REGISTRY" "$DOCKERHUB_REGISTRY"

      # Signs every pushed image by digest (keyless, this workflow's identity) in both registries. `flisk up` runs
      # `cosign verify` against that identity when cosign is installed. The digest of each layer comes back as a step output.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # A hash that is already published is not rebuilt, but images pushed before signing existed carry no signature: look for
      # one with the check `flisk up` runs, and sign (and attest) the existing digests only when it is missing.
      - name: Look for a signature on an already published hash
        id: signed
        if: steps.published.outputs.skip == 'true'
        run: |
          if bash scripts/golden/golden-signed.sh "$RUNNER_TEMP/golden" "$GHCR_REGISTRY" "$DOCKERHUB_REGISTRY"; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign the golden images by digest
        id: sign
        if: steps.published.outputs.skip != 'true' || steps.signed.outputs.signed != 'true'
        run: bash scripts/golden/sign-golden-images.sh "$RUNNER_TEMP/golden" "$GHCR_REGISTRY" "$DOCKERHUB_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for golden-l1
        if: steps.published.outputs.skip != 'true' || steps.signed.outputs.signed != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/golden-l1
          subject-digest: ${{ steps.sign.outputs.l1 }}
          push-to-registry: true

      - name: Attest build provenance for golden-l2
        if: steps.published.outputs.skip != 'true' || steps.signed.outputs.signed != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/golden-l2
          subject-digest: ${{ steps.sign.outputs.l2 }}
          push-to-registry: true

      - name: Attest build provenance for golden-l3-backend
        if: steps.published.outputs.skip != 'true' || steps.signed.outputs.signed != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/golden-l3-backend
          subject-digest: ${{ steps.sign.outputs.l3-backend }}
          push-to-registry: true

      - name: Attest build provenance for golden-l3-frontend
        if: steps.published.outputs.skip != 'true' || steps.signed.outputs.signed != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/golden-l3-frontend
          subject-digest: ${{ steps.sign.outputs.l3-frontend }}
          push-to-registry: true

      - name: Attest build provenance for golden-l4-backend
        if: steps.published.outputs.skip != 'true' || steps.signed.outputs.signed != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/golden-l4-backend
          subject-digest: ${{ steps.sign.outputs.l4-backend }}
          push-to-registry: true

      - name: Attest build provenance for golden-l4-backend-node
        if: steps.published.outputs.skip != 'true' || steps.signed.outputs.signed != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/golden-l4-backend-node
          subject-digest: ${{ steps.sign.outputs.l4-backend-node }}
          push-to-registry: true

      - name: Attest build provenance for golden-l4-frontend
        if: steps.published.outputs.skip != 'true' || steps.signed.outputs.signed != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/golden-l4-frontend
          subject-digest: ${{ steps.sign.outputs.l4-frontend }}
          push-to-registry: true

      - name: Attest build provenance for golden-l4-migrator
        if: steps.published.outputs.skip != 'true' || steps.signed.outputs.signed != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/golden-l4-migrator
          subject-digest: ${{ steps.sign.outputs.l4-migrator }}
          push-to-registry: true

      # Reads the signatures back with the check `flisk up` runs, so a signing step that silently did nothing fails here.
      - name: Verify the golden image signatures
        if: steps.published.outputs.skip != 'true' || steps.signed.outputs.signed != 'true'
        run: |
          set -euo pipefail
          tag12="$(sha256sum "$RUNNER_TEMP/golden/golden-layers.Dockerfile" | cut -c1-12)"
          for layer in l1 l2 l3-backend l3-frontend l4-backend l4-backend-node l4-frontend l4-migrator; do
            for registry in "$GHCR_REGISTRY" "$DOCKERHUB_REGISTRY"; do
              cosign verify \
                --certificate-identity-regexp 'https://github.com/flisk-sh/flisk/.github/workflows/publish-golden-images.yml@.*' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$registry/golden-$layer:$tag12" >/dev/null
            done
          done
