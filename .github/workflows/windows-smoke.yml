name: Windows CLI smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      examples_only: ${{ steps.detect.outputs.examples_only }}
      wsl2_irrelevant: ${{ steps.detect.outputs.wsl2_irrelevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/docs-only # zizmor: ignore[self-repository] composite action resolves from this commit

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: docs
    # Skip on docs-only and bring-your-own-example-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.docs.outputs.docs_only != 'true' && needs.docs.outputs.examples_only != 'true' }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install --ignore-scripts

      # The cases live in tests/e2e/platforms/windows (suite.json, run.sh, native-refusal.ps1).
      - name: Typecheck, build and run CLI help
        shell: bash
        run: tests/e2e/platforms/windows/run.sh W1

      - name: Run Windows platform unit tests
        shell: bash
        run: tests/e2e/platforms/windows/run.sh W2

      - name: Verify native Windows CLI contract
        shell: bash
        run: tests/e2e/platforms/windows/run.sh W3
