# Fails when a pinned `node-version:` is behind the newest release of its Node line. A pin never takes a Node security
# fix by itself, so this checks every Monday and on demand. Fix it as docs/releasing.md describes.
name: 🔎 Report | Node pins are current

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-pins:
    name: 🔎 Node pins are current
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.5
      - run: node scripts/check-node-pins.mjs
