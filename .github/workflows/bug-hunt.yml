# FALSIFIER (tests/falsifier) every night with a fresh seed, then the bug-hunt ledger (scripts/bug-hunt-issues.mjs): one record
# per distinct defect, uploaded as an artifact. Issues are filed only when a person dispatches the run with file_issues set, until
# the nightly yield has been read for a few nights. No Docker, no Tilt. ORACLE has its own nightly (oracle.yml); its failure file
# has the same shape and joins the ledger by adding it to the script's arguments.
name: 🌙 NIGHTLY | 🔨 FALSIFIER | Bug hunt

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "First seed (empty draws a random one)"
        type: string
        default: ""
      scenarios:
        description: "How many scenarios"
        type: string
        default: "100"
      file_issues:
        description: "File or reopen one issue per distinct defect"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: bug-hunt
  cancel-in-progress: false

jobs:
  falsifier:
    name: 🔨 FALSIFIER properties hold
    runs-on: ubuntu-26.04
    # About 3 minutes for 100 scenarios locally; a slower runner and a retry budget fit in 30.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.12.0
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Run FALSIFIER
        id: run
        env:
          INPUT_SEED: ${{ inputs.seed }}
          INPUT_SCENARIOS: ${{ inputs.scenarios || '100' }}
        shell: bash # pipefail: a failing run fails the step even though tee ends the pipe
        run: |
          seed="${INPUT_SEED:-$((RANDOM * 32768 + RANDOM))}"
          echo "### FALSIFIER, first seed ${seed}, ${INPUT_SCENARIOS} scenarios" >> "$GITHUB_STEP_SUMMARY"
          echo "Replay a finding with the command printed under it." >> "$GITHUB_STEP_SUMMARY"
          status=0
          node tests/falsifier/run.mjs --seed "$seed" --scenarios "$INPUT_SCENARIOS" --out "$RUNNER_TEMP/bug-hunt" | tee "$RUNNER_TEMP/falsifier.log" || status=$?
          { echo '```'; cat "$RUNNER_TEMP/falsifier.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        continue-on-error: true
      - name: Build the ledger
        if: always()
        env:
          FILE_ISSUES: ${{ inputs.file_issues && '--file-issues' || '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          failures="$RUNNER_TEMP/bug-hunt/falsifier-failures.json"
          [ -f "$failures" ] || echo '[]' > "$failures"
          # shellcheck disable=SC2086 # FILE_ISSUES is empty or one flag
          node scripts/bug-hunt-issues.mjs "$failures" --ledger "$RUNNER_TEMP/bug-hunt/ledger.json" --repo "$GH_REPO" $FILE_ISSUES | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bug-hunt-ledger
          path: ${{ runner.temp }}/bug-hunt
          if-no-files-found: ignore
      - name: Fail when FALSIFIER found a defect
        if: steps.run.outcome == 'failure'
        run: exit 1
