# OpenSSF Scorecard: scores the repo's security practices and publishes the result for the README badge.
# Needs no account or secret; results are published with the workflow's OIDC token.
name: 🏅 Scorecard

on:
  schedule:
    - cron: "41 5 * * 1" # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: 🏅 Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF results
      id-token: write # publish results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
