# Exercises the licensed `sablier.deferStart` path through a real generated
# project, Tilt, Docker Compose, Traefik, the wake gateway, and the backend.
# This deliberately does not run on pull_request: it needs a premium license
# secret, and PR code must not be able to read that secret.
name: 🧊 Deferred cold-start E2E

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to test (local checkout if empty; latest or exact version also accepted)"
        type: string
        default: ""
  schedule:
    - cron: "0 7 * * 3"
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Release binaries and npm package"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cold-start-e2e
  cancel-in-progress: false

jobs:
  # Secrets are not readable in a job-level `if`, so the check runs first and its output gates the job. Without the
  # secret the licensed job is skipped, and this job writes a warning to the run and to the job summary. GitHub has no
  # neutral job conclusion, so the skipped job is the neutral result; this check succeeds and nothing fails.
  license:
    name: Check TDK_LICENSE_KEY
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      TDK_LICENSE_KEY: ${{ secrets.TDK_LICENSE_KEY }}
    steps:
      - id: check
        run: |
          if [ -z "$TDK_LICENSE_KEY" ]; then
            echo "::warning title=TDK_LICENSE_KEY not configured::Skipped the licensed cold-start E2E. Add the TDK_LICENSE_KEY Actions secret with a key granting sablier to run it."
            {
              echo "### ⚠️ Licensed cold-start E2E skipped"
              echo
              echo "The \`TDK_LICENSE_KEY\` Actions secret is not configured, so the cold-start job did not run. Add the secret with a key granting \`sablier\` to run it. This is not a failure."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  cold-start:
    name: 🧊 Wake a deferred backend during bring-up
    needs: license
    if: needs.license.outputs.configured == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TDK_LICENSE_KEY: ${{ secrets.TDK_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Choose the CLI version to test
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            version="$(node -p "require('./package.json').version")"
          elif [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="local"
          else
            version="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing @tdk-landscape/tdk-cli-core@$version"

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Free port 5432 (runner's preinstalled Postgres)
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install TDK
        uses: ./.github/actions/install-tdk # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Run the deferred cold-start scenario
        run: tests/e2e/journeys/cold-start/run.sh CS1

      # Failure evidence (#1382): on a failed run, keep the Docker and Tilt logs, service status and generated files for 7 days.
      - name: Collect failure evidence
        if: failure() || cancelled()
        uses: ./.github/actions/collect-e2e-evidence # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          name: cold-start

      - name: Diagnostics on failure
        if: failure() || cancelled()
        run: |
          project="$RUNNER_TEMP/tdk-cold-start"
          echo "::group::tdk up log"
          tail -200 "$project/up.log" 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::tdk doctor log"
          cat "$project/doctor.log" 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Docker containers"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          echo "::endgroup::"
          echo "::group::Tilt resources"
          tilt get uiresources -o wide 2>&1 | head -100 || true
          echo "::endgroup::"

      - name: Stop TDK project
        if: always()
        run: |
          cd "$RUNNER_TEMP/tdk-cold-start" 2>/dev/null || exit 0
          tdk down || true
