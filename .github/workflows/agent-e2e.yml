# Proves the AI agent surface on a real stack: an `agent` resource through `tdk up`, `tdk agent sessions`, `tdk restart`, the MCP
# tools over stdio, and the skill/doc distribution checks (#1268). Assertions live in tests/e2e/resource-types/agent/run.sh (cases in CI order in its suite.json); each case below is
# its own step so a red run points at one behavior. After a release and nightly it tests the published npm package; on a pull
# request it tests that PR's own package (`npm pack`). Also runnable from the Actions tab.
name: 🤖 Agent E2E

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to test (latest or exact version; local checkout is used for pull requests)"
        type: string
        default: ""
  pull_request:
    branches: [main]
    paths:
      - "cli/src/commands/agent.ts"
      - "cli/src/commands/restart.ts"
      - "cli/src/mcp/**"
      - "cli/src/agent-runtimes/**"
      - "engine/**"
      - ".claude/skills/**"
      - "scripts/sync-tdk-skills.sh"
      - "tests/e2e/lib/**"
      - "tests/e2e/resource-types/agent/**"
      - ".github/workflows/agent-e2e.yml"
  schedule:
    - cron: "30 6 * * *"
  # Prove each release right after it is published. Read-only token, no secrets, main branch only; it checks out main itself
  # rather than the triggering run's ref, so nothing untrusted is executed.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Release binaries and npm package"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Release and nightly runs queue and are never cancelled mid-boot; a pull request's newer push supersedes its older run.
concurrency:
  group: agent-e2e${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-e2e:
    name: 🤖 Agent on a live stack
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Choose the version to test
        id: version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            version="$(node -p "require('./package.json').version")"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="local"
          elif [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
          else
            version="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing @tdk-landscape/tdk-cli-core@$version"
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      # Same fix as quickstart-e2e: the runner's preinstalled Postgres holds 5432, which collides with the stack's.
      - name: Free port 5432 (runner's preinstalled Postgres)
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install TDK
        env:
          TDK_VERSION: ${{ steps.version.outputs.version }}
        run: | # zizmor: ignore[adhoc-packages] the point is to test what users install
          if [ "$TDK_VERSION" = "local" ]; then
            bun install --frozen-lockfile
            tarball="$(npm pack --silent | tail -1)"
            node scripts/install-global.mjs "./$tarball"
            exit 0
          fi
          if [ "$TDK_VERSION" != "latest" ]; then
            scripts/wait-for-npm-version.sh "@tdk-landscape/tdk-cli-core" "$TDK_VERSION"
          fi
          node scripts/install-global.mjs "@tdk-landscape/tdk-cli-core@${TDK_VERSION}"

      - name: Tool versions and commit
        env:
          TDK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "commit: $(git rev-parse HEAD)"
          echo "tested package: @tdk-landscape/tdk-cli-core@$TDK_VERSION"
          echo "node: $(node --version)"
          echo "docker: $(docker --version)"
          echo "tilt: $(tilt version)"
          echo "tdk: $(tdk --version)"

      - name: D1 skill symlinks resolve
        run: tests/e2e/resource-types/agent/run.sh D1
      - name: D2 sync-tdk-skills fixture
        if: "!cancelled()"
        run: tests/e2e/resource-types/agent/run.sh D2
      - name: D3 docs links and removed files
        if: "!cancelled()"
        run: tests/e2e/resource-types/agent/run.sh D3

      - name: A1 scaffold project and agent
        run: tests/e2e/resource-types/agent/run.sh A1
      - name: A2 tdk up and bounded wait for ready
        run: tests/e2e/resource-types/agent/run.sh A2
      - name: A3 health and ready, direct and through Traefik
        run: tests/e2e/resource-types/agent/run.sh A3
      - name: A4 session checkpoint envelope
        run: tests/e2e/resource-types/agent/run.sh A4
      - name: A5 sticky routing
        run: tests/e2e/resource-types/agent/run.sh A5
      - name: A6 tdk restart keeps the checkpoint
        run: tests/e2e/resource-types/agent/run.sh A6
      - name: C1 MCP initialize and tools/list
        run: tests/e2e/resource-types/agent/run.sh C1
      - name: C2 MCP payloads equal CLI envelopes
        run: tests/e2e/resource-types/agent/run.sh C2
      - name: C3 MCP projectPath and structured errors
        run: tests/e2e/resource-types/agent/run.sh C3
      - name: A8 graceful drain on SIGTERM
        run: tests/e2e/resource-types/agent/run.sh A8
      - name: B0 stop the agent container
        run: tests/e2e/resource-types/agent/run.sh B0
      - name: B1 AGENT_NOT_RUNNING
        run: tests/e2e/resource-types/agent/run.sh B1
      - name: B2 timeout bound
        run: tests/e2e/resource-types/agent/run.sh B2
      - name: B3 stalled body bound
        run: tests/e2e/resource-types/agent/run.sh B3
      - name: B4 AGENT_REQUEST_FAILED
        run: tests/e2e/resource-types/agent/run.sh B4
      - name: A4b envelope nesting with hostile replies
        run: tests/e2e/resource-types/agent/run.sh A4b
      - name: B5 TILT_TRIGGER_FAILED
        run: tests/e2e/resource-types/agent/run.sh B5
      - name: B6 SESSION_ID_REQUIRED
        run: tests/e2e/resource-types/agent/run.sh B6
      - name: B7 UNKNOWN_RESOURCE, NOT_AN_AGENT, NO_PORT
        run: tests/e2e/resource-types/agent/run.sh B7
      - name: A7 durability across down/up and volume removal
        run: tests/e2e/resource-types/agent/run.sh A7
      - name: B8 TILT_NOT_RUNNING
        run: tests/e2e/resource-types/agent/run.sh B8

      - name: Collect diagnostics
        if: failure()
        run: tests/e2e/resource-types/agent/run.sh diagnostics
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-e2e-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/tdk-e2e/agent/artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down
        if: always()
        run: tests/e2e/resource-types/agent/run.sh cleanup
