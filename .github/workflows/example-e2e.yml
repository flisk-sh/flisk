name: 🧪 Default example E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: ./.github/workflows/docs-only.yml # zizmor: ignore[self-repository] reusable workflow resolves from this commit, not the job filesystem
    permissions:
      contents: read
      pull-requests: read

  example-e2e:
    name: example-e2e
    runs-on: ubuntu-latest
    needs: docs
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.docs.outputs.docs_only != 'true' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Free required host ports
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          ports: "80 443 5432"

      # The four default-example cases (tests/e2e/examples/default): build and pack, install, clone and configure, then boot and
      # prove the routed worker write path.
      - name: Build and pack the candidate TDK package
        run: tests/e2e/examples/default/run.sh D1

      - name: Pack and install the candidate TDK package
        run: tests/e2e/examples/default/run.sh D2 # zizmor: ignore[adhoc-packages] installs our own freshly packed tarball

      - name: Clone and configure the bundled example
        run: tests/e2e/examples/default/run.sh D3

      - name: Boot, health check, and prove the routed worker write path
        run: tests/e2e/examples/default/run.sh D4

      # Failure evidence (#1382): on a failed run, keep the Docker and Tilt logs, service status and generated files for 7 days.
      - name: Collect failure evidence
        if: failure() || cancelled()
        uses: ./.github/actions/collect-e2e-evidence # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          name: example-default

      - name: Diagnostics on failure
        if: failure() || cancelled()
        run: |
          if [ ! -d tdk-example ]; then exit 0; fi
          cd tdk-example
          tail -160 up.log 2>/dev/null || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
          docker logs tdk_example_nats 2>&1 | tail -200 || true

      - name: Stop example
        if: always()
        run: |
          if [ -d tdk-example ]; then
            cd tdk-example
            tdk down || true
          fi
