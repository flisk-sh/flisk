# Runs the tdk up warm and cold start benchmark on the restaurant example after every change to main
# that can affect start-up, then publishes an HTML report to GitHub Pages.
#
# The job builds the CLI from the commit being tested (not the published npm package), so the numbers
# say what main does. Results are for a clean GitHub-hosted runner; they are not comparable with the
# macOS numbers in benchmarks/results.
name: 📊 Benchmarks report

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "engine/**"
      - "discovery/**"
      - "scripts/benchmark/**"
      - "benchmarks/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:
    inputs:
      cold_runs:
        description: "Cold runs (full rebuild, slow)"
        type: string
        default: "1"
      warm_runs:
        description: "Warm runs"
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  measure:
    name: ⏱️ Measure tdk up on the restaurant example
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: meta
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tdk-landscape/tdk-restaurant-example
          path: restaurant
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Build the CLI from this commit
        run: |
          bun install --frozen-lockfile
          (cd cli && npm run build)
          chmod +x cli/bin/tdk.js
          # The package's bin entry is tdk.js; expose it as `tdk`, the name every later step runs.
          mkdir -p "$RUNNER_TEMP/tdk-bin"
          ln -sf "$GITHUB_WORKSPACE/cli/bin/tdk.js" "$RUNNER_TEMP/tdk-bin/tdk"
          echo "$RUNNER_TEMP/tdk-bin" >> "$GITHUB_PATH"

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Machine
        run: |
          echo "cpus: $(nproc)"; free -h; df -h / | tail -1
          docker version --format 'docker {{.Server.Version}}'
          tdk --version; tilt version | head -1

      - name: Generate the restaurant project
        working-directory: restaurant
        env:
          TDK_EXTENSION_SOURCE: ${{ github.workspace }}
        run: tdk project --yes

      - name: Cold and warm starts
        env:
          TDK_EXTENSION_SOURCE: ${{ github.workspace }}
          COLD_RUNS: ${{ inputs.cold_runs || '1' }}
          WARM_RUNS: ${{ inputs.warm_runs || '1' }}
        run: |
          scripts/benchmark/tdk-up-warm-start.sh \
            --project restaurant \
            --out "$RUNNER_TEMP/bench" \
            --cold-runs "$COLD_RUNS" \
            --warm-runs "$WARM_RUNS" \
            --healthy 8

      - name: Build the report
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/benchmark/build-report.mjs \
            --run "$RUNNER_TEMP/bench" \
            --history benchmarks/results \
            --out "$RUNNER_TEMP/site" \
            --commit "$COMMIT" \
            --run-url "$RUN_URL"
          cp -r "$RUNNER_TEMP/bench" "$RUNNER_TEMP/site/raw"
          {
            cat "$RUNNER_TEMP/bench/summary.md"
            echo ""
            echo "Report: the Pages site for this repository (updated on main)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-report
          path: ${{ runner.temp }}/site
          if-no-files-found: warn

      - name: Stop the project
        if: always()
        working-directory: restaurant
        run: tdk down || true

  publish:
    name: 🌐 Publish the report to GitHub Pages
    needs: measure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: benchmark-report
          path: site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
