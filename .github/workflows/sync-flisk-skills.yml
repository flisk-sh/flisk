name: 🔁 Automation | Sync shared Flisk skills

on:
  workflow_dispatch:
  repository_dispatch:
    types: [flisk-skills-updated]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # push the synced skills to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flisk-sh/flisk-skills
          path: .tmp-flisk-skills
          persist-credentials: false
      - name: Sync skills
        run: FLISK_SKILLS_REPO="$GITHUB_WORKSPACE/.tmp-flisk-skills" scripts/sync-flisk-skills.sh
      - name: Commit sync if changed
        run: |
          rm -rf .tmp-flisk-skills
          if git diff --quiet; then
            echo "Skills are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills .agents/skills
          git commit -m "Sync shared Flisk skills"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ github.token }}
