name: Release binaries and npm package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "cli/package.json"
  # Every pull request runs this workflow so the release checks (windows-binary) always report.
  # The `changes` job below decides whether the build and smoke test actually run; when they
  # are not needed they are skipped, and a skipped required check counts as passing.
  pull_request:

permissions:
  contents: read

# Queue releases instead of running them side by side: two runs for the same
# version upload the same assets and one fails with "already exists".
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-smoke-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            release:
              - ".github/workflows/release-binaries.yml"
              - "package.json"
              - "bun.lock"
              - "cli/**"
              - "scripts/release-binaries.sh"
              - "Tiltfile"
              - "engine/**"
              - "discovery/**"
              - "specs/**"
              - "ext/**"
              - "shared-platform-engineering/docker-templates/**"

  build:
    needs: changes
    # Pushes to main and manual runs build; a pull request builds only when release inputs changed.
    # The merge of the automatic version-bump PR touches package.json, but it carries no new code:
    # releasing it would find its own version already on npm and publish an empty next version,
    # whose bump PR would start the next release, and so on. Skip it (skipping build skips smoke and publish).
    if: >-
      (github.event_name != 'pull_request' || needs.changes.outputs.release == 'true')
      && !(github.event_name == 'push'
      && startsWith(github.event.head_commit.message, 'Release ')
      && contains(github.event.head_commit.message, '(automatic version bump)'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      bumped: ${{ steps.version.outputs.bumped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          bun-version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - run: bun install --frozen-lockfile
        working-directory: cli

      # The Linux compiled-binary project-generation smoke test runs tdk doctor,
      # which requires Tilt and the TDK host ports to be available.
      - name: Install Tilt for the Linux release binary smoke test
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Free required host ports for the Linux release binary smoke test
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          ports: "80 443 5432"

      # Choose the release version before the binary build so candidate assets,
      # the smoke job, and the npm package all use one version.
      - name: Pick an unreleased version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(node -p "require('./package.json').version")
          # main is protected, so the bot's version-bump push is usually rejected and package.json
          # lags behind. Start from the newest published version instead of counting up from it.
          latest=$(npm view "@tdk-landscape/tdk-cli-core" version 2>/dev/null || true)
          version=$(node -e '
            const [cur, latest] = process.argv.slice(1);
            const parse = (v) => v.split(".").map(Number);
            const newer = latest && parse(latest).some((n, i) => n !== parse(cur)[i]
              && n > parse(cur)[i] && parse(latest).slice(0, i).every((m, j) => m === parse(cur)[j]));
            console.log(newer ? latest : cur);
          ' "$current" "$latest")
          while npm view "@tdk-landscape/tdk-cli-core@${version}" version >/dev/null 2>&1 \
            || gh release view "v${version}" --repo tdk-landscape/tdk-cli-releases >/dev/null 2>&1; do
            version=$(node -p 'const [a, b, c] = process.argv[1].split(".").map(Number); [a, b, c + 1].join(".")' "$version")
          done
          if [ "$version" = "$current" ]; then
            echo "Releasing ${version}."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${current} is already released; releasing this commit as ${version}."
            node -e '
              const fs = require("fs");
              for (const file of ["package.json", "cli/package.json"]) {
                const before = fs.readFileSync(file, "utf8");
                const after = before.replace(/("version":\s*")[^"]+"/, (_, key) => key + process.argv[1] + "\"");
                if (after === before) throw new Error("no version field in " + file);
                fs.writeFileSync(file, after);
              }
            ' "$version"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build release candidate
        run: scripts/release-binaries.sh

      - name: Upload exact release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dist-${{ steps.version.outputs.version }}
          path: release-dist-${{ steps.version.outputs.version }}/
          if-no-files-found: error
          retention-days: 2

  # The Windows release candidate, checked by tests/e2e/platforms/windows-binary (WB1). It has its own check name: the
  # windows-smoke check is reported by windows-smoke.yml alone, the source build (#1300).
  windows-binary:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download exact release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist-${{ needs.build.outputs.version }}
          path: release-dist

      - name: Verify checksums, version, and bundled runtime layout
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: tests/e2e/platforms/windows-binary/run.sh WB1

  publish:
    if: github.event_name != 'pull_request'
    needs: [build, windows-binary]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          bun-version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: node scripts/install-global.mjs npm@12.2.0 # zizmor: ignore[adhoc-packages] npm CLI is pinned for trusted publishing

      - name: Restore selected release version
        if: needs.build.outputs.bumped == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            for (const file of ["package.json", "cli/package.json"]) {
              const before = fs.readFileSync(file, "utf8");
              const after = before.replace(/("version":\s*")[^"]+"/, (_, key) => key + process.argv[1] + "\"");
              if (after === before) throw new Error("no version field in " + file);
              fs.writeFileSync(file, after);
            }
          ' "$VERSION"

      - run: bun install --frozen-lockfile
        working-directory: cli

      - run: npm run build

      - name: Download exact release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist-${{ needs.build.outputs.version }}
          path: release-dist-${{ needs.build.outputs.version }}

      - name: Capture source commit for release notes
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish verified binary release
        run: scripts/release-binaries.sh --publish-only
        env:
          GH_TOKEN: ${{ secrets.BINARY_RELEASE_TOKEN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}

      # Tell each fixed issue which release carries it. Best effort: a failure here must
      # never fail the release, so it is allowed to error.
      - name: Credit fixed issues with this release
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const version = process.env.VERSION;
            const head = process.env.SOURCE_COMMIT;
            const releases = (await github.rest.repos.listReleases({ owner, repo: 'tdk-cli-releases', per_page: 5 })).data;
            const current = releases.find((r) => r.tag_name === `v${version}`);
            const previous = releases.find((r) => r.tag_name !== `v${version}`);
            if (!current || !previous) return;
            const since = previous.published_at.slice(0, 19) + 'Z';
            const prs = (await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:pr is:merged merged:>=${since}`, sort: 'updated', order: 'desc', per_page: 50,
            })).data.items;
            for (const item of prs) {
              const pr = (await github.rest.pulls.get({ owner, repo, pull_number: item.number })).data;
              // Only credit PRs whose merge commit is part of this release's source commit.
              const cmp = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${pr.merge_commit_sha}...${head}` });
              if (!['ahead', 'identical'].includes(cmp.data.status)) continue;
              const res = await github.graphql(
                `query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){
                   closingIssuesReferences(first:20){nodes{number}}}}}`, { o: owner, r: repo, n: pr.number });
              for (const { number } of res.repository.pullRequest.closingIssuesReferences.nodes) {
                const mark = `<!-- tdk:shipped:${number} -->`;
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
                if (comments.some((c) => c.body && c.body.includes(mark))) continue;
                await github.rest.issues.createComment({ owner, repo, issue_number: number,
                  body: `${mark}\nShipped in [v${version}](${current.html_url}) (from #${pr.number}). Update with \`tdk upgrade\`, then tell us if it works for you. 🚀` });
              }
            }

      # The root package owns the public tdk bin entry and compiled CLI.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::Expected package version $VERSION, got $PKG_VERSION"
            exit 1
          fi
          if npm view "@tdk-landscape/tdk-cli-core@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "@tdk-landscape/tdk-cli-core@${PKG_VERSION} is already published, skipping."
          else
            npm publish --access public --provenance
          fi

      # Keep main in step with what was published. A push made with
      # github.token doesn't trigger workflows, so this can't loop. If it
      # fails, the release is still out; the next run bumps past it anyway.
      - name: Commit the version bump
        if: needs.build.outputs.bumped == 'true'
        env:
          # A PR opened with github.token never starts pull_request workflows, so the required checks would
          # never report. RELEASE_PAT (a fine-grained PAT or GitHub App token) fixes that.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          node -e '
            const fs = require("fs");
            const [version, date] = process.argv.slice(1);
            if (!fs.existsSync("CHANGELOG.md")) process.exit(0);
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
            const start = lines.indexOf("## Unreleased");
            if (start === -1) process.exit(0);
            let end = lines.findIndex((line, index) => index > start && line.startsWith("## "));
            if (end === -1) end = lines.length;
            if (!lines.slice(start + 1, end).some((line) => line.trim())) process.exit(0);
            lines.splice(start + 1, 0, "", "## " + version + " (" + date + ")");
            fs.writeFileSync("CHANGELOG.md", lines.join("\n"));
          ' "$VERSION" "$(date -u +%F)"
          git add package.json cli/package.json
          if [ -f CHANGELOG.md ]; then git add CHANGELOG.md; fi
          git commit -m "Release ${VERSION} (automatic version bump)"
          # main requires the example-e2e and windows-smoke checks, which a direct push from github.token never
          # reports, so the bump goes through a pull request that runs them. The commit only changes version
          # fields and the changelog, so the published artifacts and their checksums are unaffected.
          branch="release/bump-${VERSION}"
          # The checkout keeps no credentials, so push with the token explicitly.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force "$remote" "HEAD:refs/heads/${branch}"
          if ! gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "Release ${VERSION} (automatic version bump)" \
              --body "Version bump to ${VERSION}, opened by the release workflow after it published the release to npm and GitHub. Merges once the required checks pass."
          fi
          gh pr merge "$branch" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch || \
            echo "::warning::Released ${VERSION}, but could not enable auto-merge for the version bump PR ${branch}."

      # OpenSSF Scorecard's Signed-Releases check looks at the GitHub releases of THIS repository, while the binaries live in
      # tdk-cli-releases. So this repository gets a release per version that carries the binaries' checksums and a keyless
      # Sigstore signature of them (the signature is also attached to the binary release in tdk-cli-releases). It runs last and is allowed to fail: npm, the binary release and the version bump are already
      # done, and nothing here may ever block them.
      - name: Install cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums and attach them to a release in this repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.BINARY_RELEASE_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          cp "release-dist-${VERSION}/checksums.txt" checksums.txt
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
          # Next to the binaries users download, so they can verify them.
          GH_TOKEN="$RELEASE_TOKEN" gh release upload "v${VERSION}" --repo tdk-landscape/tdk-cli-releases --clobber \
            checksums.txt.sigstore.json || echo "::warning::Could not attach the signature to the tdk-cli-releases release"
          # And to a release in this repository, which is where Scorecard looks.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" --clobber checksums.txt checksums.txt.sigstore.json
          else
            gh release create "v${VERSION}" --target "$SOURCE_COMMIT" --latest=false --title "v${VERSION}" \
              --notes "Signed checksums for tdk ${VERSION}. The binaries are on https://github.com/tdk-landscape/tdk-cli-releases/releases/tag/v${VERSION} and the npm package is @tdk-landscape/tdk-cli-core@${VERSION}. Verify with: cosign verify-blob --bundle checksums.txt.sigstore.json --certificate-identity-regexp 'https://github.com/tdk-landscape/tdk-cli-core/.github/workflows/release-binaries.yml@.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt" \
              checksums.txt checksums.txt.sigstore.json
          fi

      # SLSA build provenance for the checksums (a GitHub attestation tied to this workflow run), attached to the release as
      # checksums.txt.intoto.jsonl. Untested until the next release runs: Scorecard's Signed-Releases check then needs
      # provenance on the last five releases, so the score moves gradually. Like the signature, it can never block a release.
      - name: Attest build provenance for the checksums
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: checksums.txt

      - name: Attach the provenance to the release in this repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh attestation download checksums.txt --repo "$GITHUB_REPOSITORY"
          mv sha256:*.jsonl checksums.txt.intoto.jsonl
          gh release upload "v${VERSION}" --repo "$GITHUB_REPOSITORY" --clobber checksums.txt.intoto.jsonl
