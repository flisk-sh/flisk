# GitHub's CodeQL code scanning (free for public repos). Findings appear under Security > Code scanning.
name: 🔀 PR | Security | CodeQL

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "17 4 * * 1" # weekly, so new queries catch old code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep each PR head SHA's CodeQL run: Scorecard evaluates SAST coverage per
  # merged PR commit, so cancelling an older run can leave that SHA unscanned.
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  # One job, one runner: CodeQL analyzes both languages in a single init/analyze (each keeps its own
  # /language:<name> category, which the main ruleset's code-scanning rule waits for), then the Starlark analyzer runs.
  analyze:
    name: 🔬 Analyze
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write # upload SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its base, to list what the PR changes
      # A pull request that touches no Starlark has nothing for the Starlark analyzer to find, so that step is skipped
      # while the job still passes. Merge groups and the weekly run always scan.
      - name: Does this change touch Starlark?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            if git diff --name-only HEAD^1 HEAD | grep -Eq '\.(star|bzl)$|(^|/)Tiltfile$|^\.github/workflows/codeql\.yml$'; then
              run=true
            else
              run=false
              echo "No Starlark files changed in this pull request; skipping the Starlark analysis."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript,actions
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      # Starlark (Tiltfiles, *.star) has no CodeQL extractor. This unofficial community analyzer reports through SARIF into
      # the same Code scanning view. Pinned to a full commit like every other action here.
      - if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        uses: flisk-sh/codeql-starlark@2dfbd614fa9097279c0938e3469b86bc43930dfc # v0.2.2
