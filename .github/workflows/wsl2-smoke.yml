name: WSL2 Ubuntu smoke (Docker Engine)

on:
  workflow_dispatch:
  pull_request:
    # `ready_for_review` re-runs the check for a draft that was skipped while it was a draft.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wsl2-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wsl2-smoke:
    runs-on: windows-2022
    # Manual runs only (Actions -> Run workflow). On pull requests and pushes the job is skipped, and a skipped job still
    # satisfies the required `wsl2-smoke` check, so branch protection needs no change. It was flaky on setup-wsl's
    # `wsl --update` 403 and on the Ubuntu and Docker mirrors (#716, #717) and cost a Windows runner on every PR.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        id: wsl
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          use-cache: false
          additional-packages: ca-certificates curl git xz-utils unzip jq

      # Each step runs one case of tests/e2e/platforms/wsl2/run.sh (suite.json, run.sh) in the distro. WS1 copies the checkout
      # to /root/tdk-ci, and the later cases build and smoke-test that copy.
      - name: Record and require a real WSL2 kernel
        shell: wsl-bash {0}
        run: tests/e2e/platforms/wsl2/run.sh WS1

      - name: Install Docker Engine and Linux development tools
        shell: wsl-bash {0}
        run: tests/e2e/platforms/wsl2/run.sh WS2

      - name: Build and install the candidate CLI
        shell: wsl-bash {0}
        run: tests/e2e/platforms/wsl2/run.sh WS3

      - name: Run the existing WSL2 routed write smoke
        shell: wsl-bash {0}
        run: tests/e2e/platforms/wsl2/run.sh WS4

      - name: Collect diagnostics
        if: always() && steps.wsl.outcome == 'success'
        shell: wsl-bash {0}
        run: tests/e2e/platforms/wsl2/run.sh WS5

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: wsl2-smoke-evidence
          path: wsl2-evidence/
          if-no-files-found: warn
