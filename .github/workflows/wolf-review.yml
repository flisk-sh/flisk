# Wolf (flisk-wolf on inference.flisk.si) reviews the service.json files a PR changes
# and posts one comment. Beta model, never blocks a merge.
# Uses pull_request, not pull_request_target: PR code is only read as text and sent
# to the model, never run. Fork PRs get no secret, so the script skips them.
# Needs the repo secret FLISK_INFERENCE_KEY (an API key from inference.flisk.si).
name: 🐺 Automation | Wolf review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "**/service.json"

permissions: {}

concurrency:
  group: wolf-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Wolf reviews service.json
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ask Wolf
        env:
          FLISK_INFERENCE_KEY: ${{ secrets.FLISK_INFERENCE_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUT_FILE: ${{ runner.temp }}/wolf-review.md
        run: node scripts/wolf-review.mjs

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUT_FILE: ${{ runner.temp }}/wolf-review.md
        run: |
          set -euo pipefail
          [ -f "$OUT_FILE" ] || exit 0
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | contains("<!-- flisk-wolf-review -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$OUT_FILE" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file "$OUT_FILE"
          fi
