# Nightly real-world adopter repositories integration testing (#3100).
# Tests realistic import, manifest verification, and startup orchestration
# against three pinned external adopter repositories on clean GitHub-hosted runners.
#
# Pinned repositories:
# - biolend83/tubehaus@749379107361318e04ec162f7419f30afef93895
# - dilolabs/nosia@42796ffb30b48b5aeece234383b71e3d51badc7e
# - LycheeOrg/Lychee@7145b37ff66ea7990cc9b8dbbf779ba1d34c0b64
name: 🌍 E2E | Real adopter repositories (nightly)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to test (local dist if empty)"
        type: string
        default: ""
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-nightly-adopters
  cancel-in-progress: false

jobs:
  adopter:
    name: ${{ matrix.name }} (${{ matrix.owner }}/${{ matrix.repo }})
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tubehaus
            owner: biolend83
            repo: tubehaus
            commit: 749379107361318e04ec162f7419f30afef93895
            health_check: "http://127.0.0.1:8080"
            needs_env: true
            env_file: |
              PORT=8080
              TUBEHAUS_BIND=127.0.0.1
          - name: Nosia
            owner: dilolabs
            repo: nosia
            commit: 42796ffb30b48b5aeece234383b71e3d51badc7e
            health_check: "http://127.0.0.1:3000"
            needs_env: false
          - name: Lychee
            owner: LycheeOrg
            repo: Lychee
            commit: 7145b37ff66ea7990cc9b8dbbf779ba1d34c0b64
            health_check: "http://127.0.0.1:80"
            needs_env: true
            env_file: |
              APP_ENV=production
              DB_CONNECTION=sqlite
    steps:
      - name: Checkout Flisk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/actions
            scripts/e2e
            scripts/install-global.mjs
            scripts/wait-for-npm-version.sh
            cli
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Free port 5432 (preinstalled Postgres)
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Flisk CLI
        uses: ./.github/actions/install-flisk # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          version: ${{ inputs.version || 'local' }}

      - name: Checkout Adopter Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.owner }}/${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          path: adopter
          persist-credentials: false

      - name: Prepare Synthetic Environment
        if: matrix.needs_env
        working-directory: adopter
        env:
          ENV_CONTENT: ${{ matrix.env_file }}
        run: |
          if [ -n "$ENV_CONTENT" ]; then
            printf "%s\n" "$ENV_CONTENT" > .env
          fi

      - name: Run Flisk Import
        working-directory: adopter
        run: |
          flisk import . --yes

      - name: Verify Generated Configuration
        working-directory: adopter
        run: |
          flisk config verify

      - name: Flisk Up with Readiness Wait
        working-directory: adopter
        timeout-minutes: 15
        run: |
          flisk up --wait --wait-timeout 900

      - name: Smoke Route Health Check
        working-directory: adopter
        timeout-minutes: 5
        env:
          TARGET: ${{ matrix.health_check }}
        run: |
          echo "Probing $TARGET..."
          for attempt in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w "%{http_code}" "$TARGET" || true)"
            if [ -n "$status" ] && [ "$status" != "000" ] && [ "$status" -lt 500 ]; then
              echo "✅ Target answered with HTTP $status (attempt $attempt)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Target $TARGET did not answer with 2xx/3xx/4xx within 120s"
          exit 1

      - name: Collect Failure Evidence
        if: failure() || cancelled()
        uses: ./.github/actions/collect-e2e-evidence # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          name: adopter-${{ matrix.repo }}
          sources: adopter

      - name: Diagnostics on Failure
        if: failure() || cancelled()
        working-directory: adopter
        run: |
          echo "::group::Containers status"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          echo "::endgroup::"
          echo "::group::Tilt UI resources"
          tilt get uiresources -o json 2>/dev/null | jq -r '.items[] | select(.status.updateStatus == "error") | "\(.metadata.name): \((.status.buildHistory // [] | map(.error // empty) | first) // "-")"' || true
          echo "::endgroup::"
          echo "::group::Flisk doctor output"
          flisk doctor || true
          echo "::endgroup::"

      - name: Report Failure Idempotently
        if: failure() && github.event_name == 'schedule' && github.repository == 'flisk-sh/flisk'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADOPTER_NAME: ${{ matrix.name }}
          REPO_NAME: ${{ matrix.owner }}/${{ matrix.repo }}
          COMMIT_SHA: ${{ matrix.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue_title="ci(nightly): ${ADOPTER_NAME} integration failure on main"
          existing=""
          lookup_ok=false
          for attempt in 1 2 3; do
            if out="$(gh issue list --repo flisk-sh/flisk --label "ci:nightly-adopters" --state open --search "${ADOPTER_NAME}" --json number --jq '.[0].number' 2>&1)"; then
              existing="$out"
              lookup_ok=true
              break
            fi
            echo "::warning::Issue lookup attempt $attempt failed: $out. Retrying in 3s..."
            sleep 3
          done

          if [ "$lookup_ok" != "true" ]; then
            echo "::error::Failed to query GitHub issues via gh CLI after 3 attempts. Aborting issue reporting to prevent duplicate issue creation."
            exit 1
          fi

          cat << EOF > /tmp/issue_body.md
          ### Nightly Integration Failure: ${ADOPTER_NAME} (${REPO_NAME}@${COMMIT_SHA})

          An automated integration run failed against pinned adopter commit on \`main\`.
          - **Adopter Repository:** https://github.com/${REPO_NAME}/tree/${COMMIT_SHA}
          - **Run URL:** ${RUN_URL}
          - **Timestamp:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          Please inspect the attached failure evidence artifact and logs in the workflow run.
          EOF

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo "Commenting on existing issue #${existing}"
            gh issue comment "$existing" --repo flisk-sh/flisk --body-file /tmp/issue_body.md
          else
            echo "Creating new issue: $issue_title"
            gh issue create --repo flisk-sh/flisk --title "$issue_title" --label "ci:nightly-adopters" --body-file /tmp/issue_body.md
          fi

      - name: Flisk Down & Cleanup
        if: always()
        working-directory: adopter
        run: |
          flisk down --prune-networks --yes || true
