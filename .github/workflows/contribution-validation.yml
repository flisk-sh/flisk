name: Validate contribution
on:
  push:
    branches:
      - fix/completion-flag-values-3701
      - fix/starter-git-remotes-3884
permissions:
  contents: read
concurrency:
  group: contribution-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      TERM: xterm-256color
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed files
        run: |
          if [ "$GITHUB_REF_NAME" = "fix/completion-flag-values-3701" ]; then
            ./node_modules/.bin/biome check --write src/commands/completion-candidates.ts src/commands/completion.ts src/commands/completion-shells.ts src/commands/__tests__/completion-candidates.test.ts
          else
            ./node_modules/.bin/biome check --write src/utils/project-templates.ts src/commands/project.ts src/utils/__tests__/project-templates.test.ts src/commands/__tests__/project-templates-catalog.test.ts
          fi
      - name: Build CLI
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Focused regression tests
        run: |
          if [ "$GITHUB_REF_NAME" = "fix/completion-flag-values-3701" ]; then
            env -u NO_COLOR bun run test -- src/commands/__tests__/completion
          else
            env -u NO_COLOR bun run test -- src/utils/__tests__/project-templates.test.ts src/commands/__tests__/project-templates-catalog.test.ts
          fi
      - name: Report generated changes
        run: |
          git add -N -f dist
          echo 'GENERATED_PATCH_BEGIN'
          git diff --binary HEAD -- src dist
          echo 'GENERATED_PATCH_END'
      - name: Full CLI test suite
        run: |
          set +e
          env -u NO_COLOR bun run test > "$RUNNER_TEMP/cli-tests.log" 2>&1
          result=$?
          tail -n 60 "$RUNNER_TEMP/cli-tests.log"
          exit "$result"
