name: Validate contribution
on:
  push:
    branches:
      - fix/completion-flag-values-3701
      - fix/starter-git-remotes-3884
permissions:
  contents: read
concurrency:
  group: contribution-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      TERM: xterm-256color
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed files
        run: |
          if [ "$GITHUB_REF_NAME" = "fix/completion-flag-values-3701" ]; then
            ./node_modules/.bin/biome check --write src/commands/completion-candidates.ts src/commands/completion.ts src/commands/completion-shells.ts src/commands/__tests__/completion-candidates.test.ts
          else
            ./node_modules/.bin/biome check --write src/utils/project-templates.ts src/commands/project.ts src/utils/__tests__/project-templates.test.ts src/commands/__tests__/project-templates-catalog.test.ts
          fi
      - name: Build CLI
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Focused regression tests
        run: |
          if [ "$GITHUB_REF_NAME" = "fix/completion-flag-values-3701" ]; then
            env -u NO_COLOR bun run test -- src/commands/__tests__/completion
          else
            env -u NO_COLOR bun run test -- src/utils/__tests__/project-templates.test.ts src/commands/__tests__/project-templates-catalog.test.ts
          fi
      - name: Full CLI test suite
        run: env -u NO_COLOR bun run test
      - name: Commit generated output and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$GITHUB_REF_NAME" = "fix/completion-flag-values-3701" ]; then
            git add -A -- src/commands/completion-candidates.ts src/commands/completion.ts src/commands/completion-shells.ts src/commands/__tests__/completion-candidates.test.ts
            git add -f -- dist/commands/completion-candidates.js dist/commands/completion.js dist/commands/completion.d.ts dist/commands/completion-shells.js dist/commands/completion-shells.d.ts
          else
            git add -A -- src/utils/project-templates.ts src/commands/project.ts src/utils/__tests__/project-templates.test.ts src/commands/__tests__/project-templates-catalog.test.ts
            git add -f -- dist/utils/project-templates.js dist/utils/project-templates.d.ts dist/commands/project.js
          fi
          git rm ../.github/workflows/contribution-validation.yml
          git diff --cached --check
          git commit -s -m 'Build CLI output and complete contribution validation'
          bun run check:dist
          git -c 'credential.helper=!gh auth git-credential' push origin HEAD:"$GITHUB_REF_NAME"

