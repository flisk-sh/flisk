# Experimental, non-blocking benchmark of TypeScript compilers on the Flisk CLI: tsc (repo pin), tsgo, ts-rust (tsc-rs).
#
# This is evidence gathering only. It changes no compiler, package.json script, lockfile, cli/dist or shipped file,
# and it is not a required check. The experimental compilers are npm packages with prebuilt binaries, installed here
# only (scripts/benchmarks/ts-compilers/package-lock.json, npm ci). No Rust or Go toolchain is installed on any
# runner, and nothing is added to Flisk's developer setup or its installed CLI.
#
# Linux and macOS run the same prebuilt binaries. Windows is deliberately untested: it needs a shell for npm shims
# and has no /usr/bin/time, and it would not change the recommendation for the JS-only Flisk distribution.
# Each OS is a separate job with continue-on-error, so a broken experimental compiler cannot affect other CI.
name: ⏱️ CI | TypeScript Compiler Benchmark

on:
  schedule:
    - cron: "0 4 * * 0" # weekly
  workflow_dispatch:
    inputs:
      runs:
        description: "Warm runs per compiler and scenario (one extra cold run is always added)"
        type: string
        default: "5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ⏱️ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true # experiment: never turns the workflow or a PR red
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      BENCH_RUNS: ${{ inputs.runs || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # The repo's own tsc (typescript 7.0.2 from bun.lock) is the baseline.
      - run: bun install --frozen-lockfile
      # Experimental compilers: exact pins, own directory and lockfile, cached by the lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/benchmarks/ts-compilers/node_modules
          key: ts-compilers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/benchmarks/ts-compilers/package-lock.json') }}
      - name: Install pinned experimental compilers
        working-directory: scripts/benchmarks/ts-compilers
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Run benchmark
        working-directory: scripts/benchmarks/ts-compilers
        env:
          DROP_CACHES: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: node bench.mjs --runs "$BENCH_RUNS" --out "results/${{ runner.os }}"
      - name: Job summary
        if: always()
        shell: bash
        run: |
          f="scripts/benchmarks/ts-compilers/results/${{ runner.os }}/report.md"
          [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" || echo "No report produced." >> "$GITHUB_STEP_SUMMARY"
      # results.json is the machine-readable record; keep it so later runs can be compared.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ts-compiler-benchmark-${{ runner.os }}-${{ github.run_id }}
          path: scripts/benchmarks/ts-compilers/results/${{ runner.os }}/
          retention-days: 90
          if-no-files-found: warn
