# Live-stack resource-type suites (#1290, tracker #1279). The plan job reads each suite's suite.json and builds a matrix of the
# suites that run for the event; each matrix leg boots one suite's stack and runs all of its cases. Replaces agent-e2e.yml.
# On a pull request a leg tests that pull request's own packed CLI. After a release and nightly it tests the published npm
# package. The gate job always runs and fails when the plan or any selected leg failed.
name: 🤖 Resource-type E2E

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to test (latest or exact version; local checkout is used for pull requests)"
        type: string
        default: ""
  pull_request:
    branches: [main]
    paths:
      - "cli/src/commands/agent.ts"
      - "cli/src/commands/restart.ts"
      - "cli/src/mcp/**"
      - "cli/src/agent-runtimes/**"
      - "engine/**"
      - ".claude/skills/**"
      - "scripts/sync-tdk-skills.sh"
      - "tests/e2e/lib/**"
      - "tests/e2e/resource-types/**"
      - ".github/workflows/e2e-resource-types.yml"
  schedule:
    - cron: "30 6 * * *"
  # Prove each release right after it is published. Read-only token, no secrets, main branch only; it checks out main itself
  # rather than the triggering run's ref, so nothing untrusted is executed.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Release binaries and npm package"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Release and nightly runs queue and are never cancelled mid-boot; a pull request's newer push supersedes its older run.
concurrency:
  group: e2e-resource-types${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan the resource-type suites
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - name: Build the matrix for this event
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            pull_request) trigger="pr" ;;
            schedule) trigger="nightly" ;;
            workflow_run) trigger="release" ;;
            *) trigger="manual" ;;
          esac
          matrix="$(node tests/e2e/lib/suite-matrix.mjs resource-types "$trigger")"
          echo "trigger=$trigger"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  resource-types:
    name: 🤖 ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Choose the version to test
        id: version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            version="$(node -p "require('./package.json').version")"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="local"
          elif [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
          else
            version="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing @tdk-landscape/tdk-cli-core@$version"

      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit
      - uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install TDK
        env:
          TDK_VERSION: ${{ steps.version.outputs.version }}
        run: | # zizmor: ignore[adhoc-packages] the point is to test what users install
          if [ "$TDK_VERSION" = "local" ]; then
            bun install --frozen-lockfile
            tarball="$(npm pack --silent | tail -1)"
            node scripts/install-global.mjs "./$tarball"
            exit 0
          fi
          if [ "$TDK_VERSION" != "latest" ]; then
            scripts/wait-for-npm-version.sh "@tdk-landscape/tdk-cli-core" "$TDK_VERSION"
          fi
          node scripts/install-global.mjs "@tdk-landscape/tdk-cli-core@${TDK_VERSION}"

      - name: Tool versions and commit
        env:
          TDK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "commit: $(git rev-parse HEAD)"
          echo "tested package: @tdk-landscape/tdk-cli-core@$TDK_VERSION"
          echo "node: $(node --version)"
          echo "docker: $(docker --version)"
          echo "tilt: $(tilt version)"
          echo "tdk: $(tdk --version)"

      # The suite runs every case in order; each case is grouped in the log so a red case is easy to find.
      - name: Run the suite
        env:
          SUITE: ${{ matrix.suite }}
        run: tests/e2e/resource-types/"$SUITE"/run.sh all

      - name: Collect diagnostics
        if: failure()
        env:
          SUITE: ${{ matrix.suite }}
        run: tests/e2e/resource-types/"$SUITE"/run.sh diagnostics
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-resource-types-${{ matrix.suite }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tdk-e2e/${{ matrix.suite }}/artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: tests/e2e/resource-types/"$SUITE"/run.sh cleanup

  # Always runs, so the gate reports a result even when no suite is selected. A selected suite that failed or was cancelled
  # fails the gate; a suite that was not selected does not.
  gate:
    name: e2e-resource-types
    needs: [plan, resource-types]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report the result
        env:
          PLAN: ${{ needs.plan.result }}
          LEGS: ${{ needs.resource-types.result }}
        run: |
          echo "plan: $PLAN; resource-type legs: $LEGS"
          if [ "$PLAN" != "success" ]; then echo "::error::The plan job did not succeed"; exit 1; fi
          if [ "$LEGS" = "failure" ] || [ "$LEGS" = "cancelled" ]; then echo "::error::A selected suite failed"; exit 1; fi
