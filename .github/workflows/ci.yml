# Checks for every PR and push to main. Run manually from the Actions tab too.
name: 🚦 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: ./.github/workflows/docs-only.yml # zizmor: ignore[self-repository] reusable workflow resolves from this commit, not the job filesystem
    permissions:
      contents: read
      pull-requests: read

  changes:
    name: 🔎 Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 1 # every job finishes in under 20s; fail fast if one hangs
    outputs:
      lockfile: ${{ steps.filter.outputs.lockfile }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            lockfile:
              - 'bun.lock'
              - 'package.json'
              - 'cli/package.json'
            workflows:
              - '.github/workflows/**'

  spellcheck:
    name: 🔤 Spell check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  lint:
    name: 🛡️ Lint
    runs-on: ubuntu-latest
    needs: docs
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.docs.outputs.docs_only != 'true' }}
    timeout-minutes: 1 # every job finishes in under 20s; fail fast if one hangs
    permissions:
      contents: write # push Biome fixes and a rebuilt cli/dist back to the PR branch
      actions: write # start CI on the pushed fix commit
    defaults:
      run:
        working-directory: cli
    env:
      # Only same-repo PRs can be pushed to; forks get a read-only token.
      AUTOFIX: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A same-repo PR checks out its own branch (not the merge commit), so fixes can be pushed to it.
          # A fork's branch does not exist in this repository, so fork PRs use the default PR merge ref.
          ref: ${{ (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref) || github.ref }}
          persist-credentials: true # zizmor: ignore[artipacked] needed to push the autofix commit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      # Applies Biome's safe fixes and rebuilds cli/dist, then commits both.
      # A push made with GITHUB_TOKEN doesn't start CI by itself, so the step
      # dispatches a CI run on the branch to check the fix commit.
      - name: Autofix lint and cli/dist
        if: env.AUTOFIX == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          bun run lint:fix || true
          bun run build
          git add -A .
          git add -f dist
          if git diff --cached --quiet; then
            echo "Nothing to fix."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Apply Biome fixes and rebuild cli/dist"
            git push
            gh workflow run ci.yml --ref "$BRANCH"
            echo "::notice::Pushed a commit with Biome fixes and a rebuilt cli/dist; started CI on it."
          fi
      - run: bun run lint

  typecheck:
    name: 🦴 Typecheck
    runs-on: ubuntu-latest
    needs: docs
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.docs.outputs.docs_only != 'true' }}
    timeout-minutes: 1 # every job finishes in under 20s; fail fast if one hangs
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  fuzz:
    name: 🧬 Fuzz
    runs-on: ubuntu-latest
    needs: docs
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.docs.outputs.docs_only != 'true' }}
    timeout-minutes: 3
    defaults:
      run:
        working-directory: tests/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run fuzz

  published-schema:
    name: 📜 Published service schema
    runs-on: ubuntu-latest
    needs: docs
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.docs.outputs.docs_only != 'true' }}
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate the service schema (offline, no live fetch)
        run: node scripts/check-published-service-schema.mjs

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: docs
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.docs.outputs.docs_only != 'true' }}
    # A hang guard, not a speed target: the suite (with every Starlark test that spawns tilt) takes 23 to 89 seconds, and a one-minute
    # limit cancelled it in 3 of 19 recent runs with no failing step.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install Tilt for Starlark generator tests
        run: |
          curl -fsSL -o tilt.tgz https://github.com/tilt-dev/tilt/releases/download/v0.37.8/tilt.0.37.8.linux.x86_64.tar.gz
          echo "e39513f958705d30524d55f68b1d46fbef2b46a0da568efd00e6383dee6be44f  tilt.tgz" | sha256sum -c -
          if [ "$(id -u)" -eq 0 ]; then tar -xzf tilt.tgz -C /usr/local/bin tilt; else sudo tar -xzf tilt.tgz -C /usr/local/bin tilt; fi
          rm -f tilt.tgz
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Free host Postgres port before project integration tests
        run: |
          sudo systemctl stop postgresql.socket 'postgresql@*.socket' 2>/dev/null || true
          sudo systemctl stop postgresql.service 'postgresql@*.service' 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove --purge -y 'postgresql*' 2>&1 | sudo tee /tmp/pg-purge.log > /dev/null || true
          sudo fuser -k 5432/tcp 2>/dev/null || true
          sleep 2
          if sudo ss -ltn 2>/dev/null | grep -q ':5432 '; then
            echo "::error::port 5432 is still in use after purging postgresql"
            sudo ss -ltnp | grep ':5432 ' || true
            tail -50 /tmp/pg-purge.log || true
            exit 1
          fi
          echo "port 5432 is free"
      - name: Run TypeScript tests through the contributor entry point
        working-directory: .
        run: make test-ts
        env:
          TDK_REQUIRE_TILT: '1'
      - name: Check shell verification script syntax
        working-directory: .
        run: make test-shell
      # test-python remains a local target until the clean-checkout failures in #700 are resolved.

  # Installs the npm package the way users do (npm install -g) and runs it,
  # so a release can't ship without the compiled CLI or its dependencies.
  package-smoke:
    name: 📦 Package Smoke Test
    runs-on: ubuntu-latest
    needs: docs
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.docs.outputs.docs_only != 'true' }}
    timeout-minutes: 3 # install Tilt and free the host Postgres port before the package smoke test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Build
        run: |
          bun install --frozen-lockfile
          npm run build

      # cli/dist is committed so `npm install -g github:tdk-landscape/tdk-cli-core`
      # works without a build step. Fail if a source change was committed
      # without rebuilding it.
      - name: Check committed cli/dist is up to date
        run: |
          # --ignored: cli/dist/ is gitignored, so a newly compiled file only
          # shows up with it.
          if [ -n "$(git status --porcelain --ignored -- cli/dist)" ]; then
            git status --short --ignored -- cli/dist
            echo "::error::cli/dist is stale. Run 'npm run build' and commit cli/dist (new files need 'git add -f')."
            exit 1
          fi

      - name: Pack and install globally
        run: | # zizmor: ignore[adhoc-packages] installs our own freshly packed tarball
          npm pack --pack-destination "$RUNNER_TEMP"
          node scripts/install-global.mjs "$RUNNER_TEMP"/tdk-landscape-tdk-cli-core-*.tgz

      - name: Install Tilt
        run: |
          curl -fsSL -o tilt.tgz https://github.com/tilt-dev/tilt/releases/download/v0.37.8/tilt.0.37.8.linux.x86_64.tar.gz
          echo "e39513f958705d30524d55f68b1d46fbef2b46a0da568efd00e6383dee6be44f  tilt.tgz" | sha256sum -c -
          if [ "$(id -u)" -eq 0 ]; then tar -xzf tilt.tgz -C /usr/local/bin tilt; else sudo tar -xzf tilt.tgz -C /usr/local/bin tilt; fi
          rm -f tilt.tgz

      - name: Free port 5432 (runner's preinstalled Postgres)
        run: |
          sudo systemctl stop postgresql.socket 'postgresql@*.socket' 2>/dev/null || true
          sudo systemctl stop postgresql.service 'postgresql@*.service' 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove --purge -y 'postgresql*' 2>&1 | sudo tee /tmp/pg-purge.log > /dev/null || true
          sudo fuser -k 5432/tcp 2>/dev/null || true

      - name: Run the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          tdk --version
          mkdir smoke-project && cd smoke-project
          tdk project --yes
          printf 'y\n' | tdk resource orders-api --type backend --stack shop
          test -f services/shop/orders-api/service.json
          echo "✅ Installed package scaffolds a project and a resource"

  secret-scan:
    name: 🔑 Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 1 # every job finishes in under 20s; fail fast if one hangs
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  # Needs "Dependency graph" turned on in Settings > Code security, then the
  # repository variable DEPENDENCY_REVIEW set to true (Settings > Variables).
  dependency-review:
    name: 🔒 Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 1 # every job finishes in under 20s; fail fast if one hangs
    needs: changes
    if: vars.DEPENDENCY_REVIEW == 'true' && needs.changes.outputs.lockfile == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  workflow-audit:
    name: 🛠️ Workflow Audit
    runs-on: ubuntu-latest
    timeout-minutes: 1 # every job finishes in under 20s; fail fast if one hangs
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          fail-on-error: true
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows/
          advanced-security: false
          annotations: true

  # Report-only code scanning, one Security > Code scanning category per tool. Nothing here
  # fails the build, so existing findings do not block PRs.
  trivy:
    name: 🐳 Trivy (dependencies, Dockerfiles, IaC)
    # Fork PRs get a read-only token, which cannot upload SARIF.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig # secrets are covered by TruffleHog in ci.yml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy

  osv-scanner:
    name: 📦 OSV-Scanner (lockfile vulnerabilities)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true # report-only: exits non-zero when it finds vulnerabilities
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv.sarif
            ./
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        if: always() && hashFiles('osv.sarif') != ''
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  semgrep:
    name: 🔎 Semgrep (SAST)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Open-source CLI with the public rule registry: no account, token or telemetry.
      - name: Semgrep
        run: | # zizmor: ignore[adhoc-packages] semgrep is pinned and only reads the checkout
          pipx run semgrep==1.180.0 scan \
            --config p/default --config p/typescript --config p/dockerfile --config p/github-actions \
            --metrics=off --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  summary:
    name: 📋 Summary
    runs-on: ubuntu-latest
    timeout-minutes: 1 # every job finishes in under 20s; fail fast if one hangs
    if: always()
    needs: [lint, spellcheck, typecheck, test, package-smoke, secret-scan, dependency-review, workflow-audit]
    steps:
      - name: Render summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(
              if .value.result == "success" then "✅ Passed"
              elif .value.result == "skipped" then "⏭️ Skipped"
              elif .value.result == "cancelled" then "🚫 Cancelled"
              else "❌ Failed" end) |"'
          } >> "$GITHUB_STEP_SUMMARY"
