name: Go dev loop E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "engine/topologies/platform/docker/dockerfile/language_dockerfile.star"
      - "engine/topologies/tilt/resources/orchestrator/apply_compose_resource_registration.star"
      - "tests/e2e/journeys/dev-loop/**"
      - ".github/workflows/go-dev-loop-e2e.yml"

permissions:
  contents: read

concurrency:
  group: go-dev-loop-e2e${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-dev-loop:
    name: Go live reload through tdk up and Traefik
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      # ubuntu-latest ships a Postgres service already listening on 5432, which fails tdk doctor's host-port check.
      - name: Free port 5432 (runner's preinstalled Postgres)
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install CLI dependencies
        working-directory: cli
        run: scripts/e2e/retry-infra.sh "bun install" -- bun install --frozen-lockfile

      # Edits the scaffolded service, breaks it, fixes it and touches go.mod, and fails if the app is down for a whole compile,
      # the compiler error is missing from the Tilt log, or a dependency change does not rebuild the image.
      - name: Run the Go dev loop check
        run: tests/e2e/journeys/dev-loop/run.sh DL1

      # Failure evidence (#1382): on a failed run, keep the Docker and Tilt logs, service status and generated files for 7 days.
      - name: Collect failure evidence
        if: failure() || cancelled()
        uses: ./.github/actions/collect-e2e-evidence # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          name: go-dev-loop
