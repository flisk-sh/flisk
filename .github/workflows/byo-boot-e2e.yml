name: BYO Python boot E2E

on:
  workflow_dispatch:
  schedule: [{ cron: "0 5 * * *" }]

permissions:
  contents: read

jobs:
  byo-python-boot:
    name: BYO Python boot and health
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      # ubuntu-latest ships a Postgres service already listening on 5432,
      # which collides with the one TDK generates and fails tdk doctor's
      # host-port check before tdk up ever runs. Removing the package keeps
      # the port free for this job.
      - name: Free port 5432 (runner's preinstalled Postgres)
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Pack and install this checkout's CLI
        working-directory: cli
        run: | # zizmor: ignore[adhoc-packages] installs the checkout's packed CLI
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
          node ../scripts/install-global.mjs "$RUNNER_TEMP"/tdk-cli-internal-*.tgz
          tdk --version

      - name: Install JSON Schema validator
        run: |
          npm ci --prefix scripts/ajv-cli --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/scripts/ajv-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Boot BYO Python fixture
        run: bash tests/e2e/byo-python-boot.test.sh

      - name: Cleanup and diagnostics
        if: always()
        run: |
          project_dir="${RUNNER_TEMP}/tdk-byo-python-boot"
          cd "$project_dir" 2>/dev/null || exit 0
          tdk down || true
          echo "::group::tdk up log (last 100 lines)"
          tail -100 up.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::docker ps -a"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          echo "::endgroup::"
          for container in $(docker ps -a --format '{{.Names}}' | grep -i legacy || true); do
            echo "::group::docker logs $container (last 80 lines)"
            docker logs --tail 80 "$container" 2>&1 || true
            echo "::endgroup::"
          done
          echo "::group::tilt resources"
          tilt get uiresources 2>&1 | head -40 || true
          echo "::endgroup::"
