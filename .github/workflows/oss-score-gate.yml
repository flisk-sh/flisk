name: 🏅 OSS score gate

# Fails the run when the repo's published OpenSSF Scorecard is below MIN_SCORE. The score only changes when Scorecard
# publishes (main on push and weekly), so this runs on those events, not on every pull request.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 13 * * 1" # after the weekly Scorecard run (Monday 05:41 UTC)
  workflow_dispatch:

concurrency:
  group: oss-score-gate-${{ github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: OSS score gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MIN_SCORE: "8.2"
    steps:
      - name: Read the published Scorecard score
        env:
          REPO: ${{ github.repository }}
          # Scorecard keys its published scores by the repository path the project
          # was first indexed under. This repo was renamed from tdk-landscape/tdk-cli-core
          # to flisk-sh/flisk, so the new path 404s until Scorecard re-indexes it.
          # The fallback is that key, not a stale name: it has to stay until the score
          # is published under flisk-sh/flisk, and it can go then.
          REPO_FALLBACK: "tdk-landscape/tdk-cli-core"
        run: |
          set -euo pipefail
          json=$(curl -fsSL --retry 3 "https://api.securityscorecards.dev/projects/github.com/${REPO}" || true)
          if [ -z "${json:-}" ]; then
            json=$(curl -fsSL --retry 3 "https://api.securityscorecards.dev/projects/github.com/${REPO_FALLBACK}")
          fi
          score=$(printf '%s' "$json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).score')
          date=$(printf '%s' "$json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).date')
          echo "Published OpenSSF Scorecard: ${score} (as of ${date}); minimum ${MIN_SCORE}."
          echo "score=${score}" >> "$GITHUB_ENV"
      - name: Fail when the score is below the minimum
        run: |
          if node -e 'process.exit(Number(process.env.score) >= Number(process.env.MIN_SCORE) ? 0 : 1)'; then
            echo "OSS score gate passed."
          else
            echo "::error::OpenSSF Scorecard ${score} is below the minimum ${MIN_SCORE}."
            exit 1
          fi
