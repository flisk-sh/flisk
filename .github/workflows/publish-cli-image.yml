name: 🐳 Release | Publish CLI image

# Builds the flisk CLI image from a published binary release (flisk-sh/releases v<version>: the two Linux binaries and the
# engine archive, checked against its checksums.txt) and pushes it for amd64 and arm64 to ghcr.io/flisk-sh/flisk and
# docker.io/alexdykyi/flisk, the same digest in both, tagged <version> and, for the newest release, latest. The digest is signed
# with cosign (keyless, this workflow's identity), and the published image then runs tests/e2e/platforms/container-image CI1.
# release-binaries.yml calls it after every release; run it by hand to publish or repair the image of an existing release.
# GHCR makes a new package private: after the first push an org owner sets the flisk package to public in its settings.
on:
  workflow_call:
    inputs:
      version:
        description: Released version, without the v
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Released version on flisk-sh/releases, without the v (for example 1.4.28)
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: Build, sign and push the CLI image
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push ghcr.io/flisk-sh/flisk with GITHUB_TOKEN
      id-token: write # keyless cosign signature
    env:
      VERSION: ${{ inputs.version }}
      # Repository secrets: the Docker Hub user and an access token that can push to <namespace>/flisk.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GHCR_REGISTRY: ghcr.io/flisk-sh
      # Docker Hub stays on the personal namespace until docker.io/flisk-sh exists; then switch this one line.
      DOCKERHUB_REGISTRY: docker.io/alexdykyi
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.4.28, got '${VERSION}'"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the release assets and check them against checksums.txt
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          gh release download "v${VERSION}" --repo flisk-sh/releases --dir "$dir" \
            --pattern flisk-linux-amd64 --pattern flisk-linux-arm64 --pattern flisk-cli-engine.tar.gz --pattern checksums.txt
          (cd "$dir" && grep -E ' (flisk-linux-amd64|flisk-linux-arm64|flisk-cli-engine\.tar\.gz)$' checksums.txt | sha256sum -c -)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          # Only the newest release moves :latest, so repairing an older release's image never rolls latest back.
          newest="$(gh release view --repo flisk-sh/releases --json tagName --jq .tagName)"
          if [ "$newest" = "v${VERSION}" ]; then echo "latest=--latest" >> "$GITHUB_OUTPUT"; else echo "latest=" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without the Docker Hub secrets (a fork) the image still goes to GHCR, and the run says the mirror was skipped.
      - name: Choose the registries
        id: registries
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "list=$GHCR_REGISTRY $DOCKERHUB_REGISTRY" >> "$GITHUB_OUTPUT"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set: pushing to ${GHCR_REGISTRY} only."
            echo "list=$GHCR_REGISTRY" >> "$GITHUB_OUTPUT"
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        id: push
        env:
          ASSETS: ${{ steps.release.outputs.dir }}
          LATEST: ${{ steps.release.outputs.latest }}
          REGISTRIES: ${{ steps.registries.outputs.list }}
        run: |
          # shellcheck disable=SC2086 # LATEST and REGISTRIES are word lists on purpose
          bash scripts/release/push-flisk-image.sh "$ASSETS" "$VERSION" $LATEST $REGISTRIES

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Verify with: cosign verify ghcr.io/flisk-sh/flisk:<version> --certificate-identity-regexp
      # 'https://github.com/flisk-sh/flisk/.github/workflows/publish-cli-image\.yml@.*'
      # --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRIES: ${{ steps.registries.outputs.list }}
        run: |
          set -euo pipefail
          for registry in $REGISTRIES; do
            cosign sign --yes "$registry/flisk@$DIGEST"
          done

      - name: Smoke the published image (tests/e2e/platforms/container-image CI1)
        env:
          FLISK_IMAGE: ghcr.io/flisk-sh/flisk:${{ inputs.version }}
        run: tests/e2e/platforms/container-image/run.sh CI1

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRIES: ${{ steps.registries.outputs.list }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          {
            echo "### flisk ${VERSION} image"
            echo
            echo "Digest \`${DIGEST}\`, signed with cosign."
            for registry in $REGISTRIES; do
              echo "- \`${registry}/flisk:${VERSION}\`${LATEST:+ and \`${registry}/flisk:latest\`}"
            done
          } >> "$GITHUB_STEP_SUMMARY"
