# Compares the editor-facing copy of the service schema with the source of truth on main. The publish workflow used to stay
# green without a token, so a stale copy could go unnoticed for weeks (#4202). This check runs nightly and on demand; it fails
# when the published property names drift, and never needs a token or checks out pull request code.
name: 🌙 NIGHTLY | Schema | Published service schema

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: 🔎 Published service schema matches main
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.5
      - name: Compare published schema properties with the source
        run: node scripts/check-published-schema-drift.mjs
