# Reports a pull request workflow that fails for the head commit of a pull request that was already merged (#2897): a comment
# on the pull request and one issue per pull request. Runs on the default branch only and never checks out pull request code.
name: 📣 CI | Report post-merge failures

on:
  workflow_run:
    workflows:
      - "✅ CI | Checks"
      - "🧭 E2E | Journeys"
      - "🧩 E2E | Resource types"
      - "🚪 E2E | Examples gate"
      - "🖥️ E2E | Platforms gate"
      - "🔌 E2E | Platforms hardware"
      - "🌀 Chaos | service.json"
      - "🛡️ Security | Scans"
      - "🔬 Security | CodeQL"
      - "BYO template e2e"
    types: [completed]

permissions: {}

concurrency:
  group: report-post-merge-failures-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    name: Report post-merge failures
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/report-post-merge-failures.mjs
