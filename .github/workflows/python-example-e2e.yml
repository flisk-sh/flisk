# Boots examples/one-backend-python (the Python backend provider's runnable
# example) and requires routed /health through Traefik. The pytest smoke test
# runs inside the generated image's `test` stage, so the runner needs no Python toolchain.
# The job proves the image Tilt actually builds (.autogenerated/Dockerfile.app.autogenerated).
#
# Path-filtered: only runs when the Python provider, its Docker/Tilt generators,
# or the example change. Not a required check on main.
name: 🐍 Python example E2E

on:
  pull_request:
    paths:
      - "cli/src/backend-languages/**"
      - "cli/src/commands/resource.ts"
      - "engine/topologies/platform/docker/dockerfile/**"
      - "engine/topologies/tilt/resources/orchestrator/**"
      - "examples/one-backend-python/**"
      - ".github/workflows/python-example-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-example-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-example-e2e:
    name: python-example-e2e
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Install Tilt
        uses: ./.github/actions/setup-tilt # zizmor: ignore[self-repository] composite action resolves from this commit

      - name: Free required host ports
        uses: ./.github/actions/free-postgres-port # zizmor: ignore[self-repository] composite action resolves from this commit
        with:
          ports: "80 443 5432"

      - name: Pack and install the candidate TDK package
        run: | # zizmor: ignore[adhoc-packages] installs our own freshly packed tarball
          bun install --frozen-lockfile
          npm run build
          tarball="$(npm pack --silent | tail -1)"
          node scripts/install-global.mjs "./$tarball"

      - name: Configure the example
        working-directory: examples/one-backend-python
        run: |
          tdk project --yes
          sed -i 's/^INFISICAL_ENABLED=.*/INFISICAL_ENABLED=false/' .env
          tdk doctor --no-ping

      - name: Boot and require routed /health
        working-directory: examples/one-backend-python
        shell: bash
        run: |
          set -euo pipefail
          tdk up one-backend-python > up.log 2>&1 &
          tdk_pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Python example E2E failed; collecting logs before teardown"
              mkdir -p ci-logs
              cp up.log doctor.json ci-logs/ 2>/dev/null || true
              tail -200 up.log 2>/dev/null || true
              docker ps -a --format 'table {{.Names}}\t{{.Status}}' 2>&1 | tee ci-logs/docker-ps.txt || true
              for c in $(docker ps -aq); do docker logs "$c" > "ci-logs/container-$c.log" 2>&1 || true; done
              tilt get uiresources -o json > ci-logs/tilt-uiresources.json 2>&1 || true
              jq -r '.items[] | "\(.metadata.name): update=\(.status.updateStatus // "-") runtime=\(.status.runtimeStatus // "-")"' ci-logs/tilt-uiresources.json 2>/dev/null || true
            fi
            kill "$tdk_pid" 2>/dev/null || true
            tdk down >/dev/null 2>&1 || true
            return "$status"
          }
          trap cleanup EXIT

          for _ in $(seq 1 75); do
            if grep -q 'Running tilt up' up.log; then break; fi
            if ! kill -0 "$tdk_pid" 2>/dev/null; then tail -120 up.log; exit 1; fi
            sleep 2
          done
          grep -q 'Running tilt up' up.log

          tdk doctor --json > doctor.json || true
          http_port="$(jq -er '.data.ports.http.chosen | select(type == "number")' doctor.json)"
          url="http://api.one-backend-python.localhost:${http_port}/api/api-backend/health"
          for _ in $(seq 1 120); do
            if curl -fsS "$url" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          body="$(curl -fsS "$url")"
          echo "$body"
          test "$(printf '%s' "$body" | jq -r .status)" = ok

      - name: Run pytest in the generated image
        working-directory: examples/one-backend-python
        run: |
          docker build --target test \
            -f services/one-backend-python/api/.autogenerated/Dockerfile.app.autogenerated .

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-example-e2e-logs
          path: examples/one-backend-python/ci-logs/
          if-no-files-found: ignore
