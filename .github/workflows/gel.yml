name: GEL
on:
  pull_request:
  # the merge queue only runs workflows that listen for merge_group; GEL is a required check there
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # weekly, so the dashboard record never expires (artifacts last 30 days)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gel-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gel:
    permissions: { contents: read, checks: read, pull-requests: read }
    uses: flisk-sh/gel/.github/workflows/gel.yml@ee8dcf96d7517490d803b3fa3148aee9500c6158 # north-star
    with: { gel_ref: ee8dcf96d7517490d803b3fa3148aee9500c6158 }
