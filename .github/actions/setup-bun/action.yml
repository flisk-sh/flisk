name: Set up Bun
description: Install Bun and restore Bun's package cache, keyed on bun.lock. Bump the pinned action here only.
inputs:
  bun-version:
    description: Bun version to install. Defaults to the version pinned in release-binaries.yml; override only in nightly-adopters.yml (canary).
    required: false
    default: "1.4.4"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
