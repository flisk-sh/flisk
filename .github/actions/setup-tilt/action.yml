name: Set up Tilt
description: Install the pinned Tilt release, checked against its SHA-256. Bump the version and checksum here only. Linux runners.
runs:
  using: composite
  steps:
    - name: Install Tilt
      shell: bash
      run: |
        scripts/e2e/retry-infra.sh "download Tilt v0.37.8" -- curl -fsSL -o tilt.tgz https://github.com/tilt-dev/tilt/releases/download/v0.37.8/tilt.0.37.8.linux.x86_64.tar.gz
        echo "e39513f958705d30524d55f68b1d46fbef2b46a0da568efd00e6383dee6be44f  tilt.tgz" | sha256sum -c -
        if [ "$(id -u)" -eq 0 ]; then tar -xzf tilt.tgz -C /usr/local/bin tilt; else sudo tar -xzf tilt.tgz -C /usr/local/bin tilt; fi
        rm -f tilt.tgz
