# Failure evidence for an E2E job (#1382). Call it with `if: failure() || cancelled()` before any cleanup step, because
# cleanup removes the containers whose logs it reads. The bundle is uploaded for 7 days, named by case and run.
# Bounds and redaction live in scripts/e2e/collect-evidence.sh.
name: Collect E2E failure evidence
description: Bundle Docker and Tilt logs, service status, tdk doctor output, and generated project files from a failed E2E job, redacted and bounded, and upload it for 7 days
inputs:
  name:
    description: Case or job label; names the artifact and its folder (letters, digits, dashes)
    required: true
  sources:
    description: Space-separated directories to scan for logs and generated files (default is the usual E2E roots under the runner temp directory)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Write the evidence bundle
      shell: bash
      env:
        EVIDENCE_NAME: ${{ inputs.name }}
        EVIDENCE_SOURCES: ${{ inputs.sources }}
      run: |
        out="${RUNNER_TEMP}/e2e-evidence/${EVIDENCE_NAME}"
        read -r -a sources <<< "$EVIDENCE_SOURCES"
        if [ "${#sources[@]}" -eq 0 ]; then
          scripts/e2e/collect-evidence.sh "$out" "$EVIDENCE_NAME" || echo "::warning::evidence collection failed; the job's own failure is unchanged"
        else
          scripts/e2e/collect-evidence.sh "$out" "$EVIDENCE_NAME" "${sources[@]}" || echo "::warning::evidence collection failed; the job's own failure is unchanged"
        fi

    - name: Upload the evidence bundle
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: e2e-evidence-${{ inputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/e2e-evidence/${{ inputs.name }}
        retention-days: 7
        if-no-files-found: warn
