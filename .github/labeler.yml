# A PR can touch several areas, so matching labels intentionally accumulate.
# `sync-labels: true` removes only labels declared below when their paths stop matching.

# Main code areas
"area: cli":
  - changed-files:
      - any-glob-to-any-file:
          - "cli/**"
          - "package.json"
          - "bun.lock"
          - "install.sh"

"area: tui":
  - changed-files:
      - any-glob-to-any-file:
          - "cli/src/components/**"
          - "cli/src/commands/ui.tsx"
          - "cli/src/commands/__tests__/*ui*.test.ts"
          - "runtime/ext/ui-enhancements/**"

"area: doctor":
  - changed-files:
      - any-glob-to-any-file:
          - "cli/src/commands/doctor.ts"
          - "cli/src/commands/__tests__/doctor.test.ts"
          - "cli/src/utils/doctor-*.ts"
          - "cli/src/utils/__tests__/doctor-*.test.ts"
          - "cli/src/utils/env-validator.ts"

"area: frontend-frameworks":
  - changed-files:
      - any-glob-to-any-file:
          - "cli/src/frontend-frameworks/**"
          - "cli/src/commands/__tests__/resource-frameworks-e2e.test.ts"
          - "cli/src/commands/__tests__/frontend-vite-generator.test.ts"
          - "runtime/engine/topologies/tilt/generators/vite/**"
          - "runtime/engine/topologies/tilt/generators/typescript/frontend_tsconfig.star"
          - "runtime/engine/schemas/service-schema.json"
          - "docs/frontend-framework-providers.md"

"area: infrastructure":
  - changed-files:
      - any-glob-to-any-file:
          - "runtime/engine/topologies/tilt/resources/**"
          - "runtime/engine/topologies/platform/**"
          - "runtime/discovery/services/platform/**"
          - "runtime/platform/services/**"
          - "runtime/shared-platform-engineering/**"
          - "cli/shared-platform-engineering/**"
          - "docs/FEATURES.md"

"area: engine":
  - changed-files:
      - any-glob-to-any-file:
          - "runtime/engine/**"
          - "runtime/Tiltfile"

"area: discovery":
  - changed-files:
      - any-glob-to-any-file:
          - "runtime/discovery/**"

"area: extensions":
  - changed-files:
      - any-glob-to-any-file:
          - "runtime/ext/**"

"area: specifications":
  - changed-files:
      - any-glob-to-any-file:
          - "runtime/specs/**"
          - "openspec/**"
          - "runtime/engine/schemas/**"

"area: tests":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "**/*.test.ts"
          - "**/*.test.tsx"
          - "**/tests/**"
          - "cli/src/**/__tests__/**"

"area: scripts":
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**"
          - "Makefile"
          - ".pre-commit-config.yaml"

"area: benchmarks":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/benchmarks/**"
          - "scripts/benchmark/**"

"area: platform":
  - changed-files:
      - any-glob-to-any-file:
          - "platform/**"
          - "runtime/shared-platform-engineering/**"
          - "cli/shared-platform-engineering/**"

"area: packaging":
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "cli/package.json"
          - "bun.lock"
          - "cli/pnpm-lock.yaml"
          - "cli/bin/**"
          - "install.sh"
          - "scripts/release-binaries.sh"
          - "scripts/stage-npm-engine.sh"
          - "release-dist*/**"

# Contributor-facing docs and repository automation
documentation:
