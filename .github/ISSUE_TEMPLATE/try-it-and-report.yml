name: I tried it and here is what I saw
description: Short, informal report from running Flisk or an example. Rough notes are fine.
title: "tried: "
labels: ["show-and-tell"]
body:
  - type: markdown
    attributes:
      value: |
        No need to be formal. Tell us what you ran and what you saw, even if it worked and even if it is only half a report. Numbers and pasted output are the most useful part.

        Not sure how to do the steps? [Try it and report what you saw](https://github.com/flisk-sh/flisk/blob/main/docs/contributing/try-and-report.md) walks through them, with filled-in examples.
  - type: input
    id: what
    attributes:
      label: What did you try?
      description: One line is enough.
      placeholder: Ran examples/one-backend-python and timed `flisk up`
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: How did it go?
      options:
        - It worked
        - It worked, but something was slow or odd
        - It failed
        - I did not finish
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: What did you see?
      description: Numbers, messages, anything surprising. Paste output below if you have it.
      placeholder: |
        First `flisk up`: 4 min 10 s.
        Second `flisk up`: 35 s.
        Edit to ready: about 6 s, API logged one connection error while Postgres started.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Pasted output (optional)
      description: Terminal output or error text. Remove passwords and tokens first.
      render: shell
  - type: input
    id: setup
    attributes:
      label: Your setup (optional)
      description: OS, Docker flavour, and the output of `flisk --version`.
      placeholder: macOS 15, OrbStack, flisk 1.3.126
