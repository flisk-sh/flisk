name: Feature request
description: Suggest an idea or improvement for TDK
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for taking the time to write this up. We aim to reply within one
        working day, and a rough report is better than none.

        Do not delete the `<!-- ai-spec-buttons -->` marker or the Write spec
        shields CI appends to this issue body. They link to AI chats that draft
        an OpenSpec change from this issue. CI never writes OpenSpec files itself.
  - type: dropdown
    id: request-scope
    attributes:
      label: Is this a local-development or cluster-deployment request?
      options:
        - Local development with Docker + Tilt
        - Cluster deployment (Helm, Kustomize, Flux, or Argo)
        - Both / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like TDK to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: markdown
    attributes:
      value: >-
        TDK runs local development on Docker + Tilt. For cluster deployments, keep
        your Helm or other Kubernetes workflow. See [TDK + Helm](https://github.com/flisk-sh/tdk-cli-core/blob/main/docs/with-helm.md).
