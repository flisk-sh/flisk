[files]
extend-exclude = [
  "**/node_modules/**",
  "**/release-dist-*/**",
  "bun.lock",
  "cli/pnpm-lock.yaml",
  "examples/byo-jobs/prisma/prisma/migrations/migration_lock.toml",
  # Translated READMEs use other languages, which the English word list flags.
  "docs/README-*.md",
  # Generated images are named after a content hash (score-84.3dbe6268.svg), which the word list reads as typos.
  "docs/assets/fit/**",
]

[default]
extend-ignore-re = [
  # Keep intentionally imperfect recorded speech as evidence.
  '(?Rm)^.*<!--\s*spellchecker:disable-line\s*-->$',
]

[default.extend-words]
# Valid alternate spelling used for the parser error class.
unparseable = "unparseable"
# Product name in contributor outreach metadata.
mirrord = "mirrord"
# Intentional invalid dependency spelling in negative OpenSpec examples.
postgress = "postgress"
# Name of the CA bundle package the BYO examples pin.
certifi = "certifi"
# in-toto attestation filename (checksums.txt.intoto.jsonl).
intoto = "intoto"
# Jest/Mocha function names that scripts/scores/skipped-tests.mjs searches for.
xdescribe = "xdescribe"
xit = "xit"
# Qiskit Aer, the quantum circuit simulator named in the GPU and provider docs.
aer = "aer"
# Amazon Braket, the quantum computing service in the provider examples (AWS_BRAKET_TOKEN).
braket = "braket"
