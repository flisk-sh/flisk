# Weekly dependency updates, grouped so minor and patch bumps arrive as one PR.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "⬆️ "
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "⬆️ "
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # First-party image with a pinned base (oven/bun). Root has no Dockerfile;
  # example/byo Dockerfiles are out of scope for this update entry.
  - package-ecosystem: docker
    directory: /engine/assets/docker/wake-gateway
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "⬆️ "
      include: scope
