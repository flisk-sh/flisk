# Weekly dependency updates, grouped so minor and patch bumps arrive as one PR.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "⬆️ "
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "⬆️ "
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # The npm CLI that release-binaries.yml uses for trusted publishing, pinned by
  # .github/npm-cli/package-lock.json. Its undici and ip-address are bundled inside npm,
  # so only a new npm release can patch them: check daily with a one-day cooldown (the
  # shortest that satisfies Semgrep's dependabot-missing-cooldown rule) so that bump
  # arrives the day after npm ships it.
  - package-ecosystem: npm
    directory: /.github/npm-cli
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "⬆️ "
      include: scope

  # First-party image with a pinned base (oven/bun). Root has no Dockerfile;
  # example/byo Dockerfiles are out of scope for this update entry.
  - package-ecosystem: docker
    directory: /runtime/engine/assets/docker/wake-gateway
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "⬆️ "
      include: scope
