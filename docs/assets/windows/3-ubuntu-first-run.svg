<svg xmlns="http://www.w3.org/2000/svg" width="640" height="170" viewBox="0 0 640 170" role="img" aria-label="Ubuntu app asking for a new UNIX user name and password">
<title>Ubuntu app asking for a new UNIX user name and password</title>
<rect width="640" height="170" fill="#f3f3f3" stroke="#9a9a9a"/>
<rect width="640" height="170" fill="#300a24"/><rect width="640" height="30" fill="#2b2b2b"/><text x="12" y="20" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="12" fill="#ffffff">Ubuntu</text><text x="560" y="21" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="14" fill="#ffffff">–   ☐   ✕</text><text x="14" y="44" font-family="Consolas,Menlo,monospace" font-size="13" fill="#ffffff" xml:space="preserve">Installing, this may take a few minutes...</text><text x="14" y="64" font-family="Consolas,Menlo,monospace" font-size="13" fill="#ffffff" xml:space="preserve">Please create a default UNIX user account.</text><text x="14" y="84" font-family="Consolas,Menlo,monospace" font-size="13" fill="#ffffff" xml:space="preserve">Enter new UNIX username: sam</text><text x="14" y="104" font-family="Consolas,Menlo,monospace" font-size="13" fill="#ffffff" xml:space="preserve">New password: </text><text x="14" y="124" font-family="Consolas,Menlo,monospace" font-size="13" fill="#ffffff" xml:space="preserve">Retype new password: </text><text x="14" y="144" font-family="Consolas,Menlo,monospace" font-size="13" fill="#8ae234" xml:space="preserve">sam@PC:~$ _</text>
<text x="630" y="162" text-anchor="end" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="10" fill="#707070">Illustration, not a real screenshot</text>
</svg>
