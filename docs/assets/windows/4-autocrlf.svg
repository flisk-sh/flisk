<svg xmlns="http://www.w3.org/2000/svg" width="640" height="144" viewBox="0 0 640 144" role="img" aria-label="Ubuntu terminal setting git core.autocrlf to input and reading it back">
<title>Ubuntu terminal setting git core.autocrlf to input and reading it back</title>
<rect width="640" height="144" fill="#f3f3f3" stroke="#9a9a9a"/>
<rect width="640" height="144" fill="#300a24"/><rect width="640" height="30" fill="#2b2b2b"/><text x="12" y="20" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="12" fill="#fff">Ubuntu</text><text x="560" y="21" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="14" fill="#fff">–   ☐   ✕</text><text x="14" y="44" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fff" xml:space="preserve">sam@PC:~$ git config --global core.autocrlf input</text><text x="14" y="64" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fff" xml:space="preserve">sam@PC:~$ git config --global core.autocrlf</text><text x="14" y="84" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fce94f" xml:space="preserve">input</text><text x="14" y="104" font-family="Consolas,Menlo,monospace" font-size="13" fill="#8ae234" xml:space="preserve">sam@PC:~$ _</text>
<text x="630" y="136" text-anchor="end" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="10" fill="#707070">Illustration, not a real screenshot</text>
