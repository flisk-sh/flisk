<svg xmlns="http://www.w3.org/2000/svg" width="640" height="264" viewBox="0 0 640 264" role="img" aria-label="Ubuntu terminal installing Git and Tilt, then printing node, tilt and git versions">
<title>Ubuntu terminal installing Git and Tilt, then printing node, tilt and git versions</title>
<rect width="640" height="264" fill="#f3f3f3" stroke="#9a9a9a"/>
<rect width="640" height="264" fill="#300a24"/><rect width="640" height="30" fill="#2b2b2b"/><text x="12" y="20" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="12" fill="#fff">Ubuntu</text><text x="560" y="21" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="14" fill="#fff">–   ☐   ✕</text><text x="14" y="44" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fff" xml:space="preserve">sam@PC:~$ sudo apt update &amp;&amp; sudo apt install -y git curl</text><text x="14" y="64" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fff" xml:space="preserve">[sudo] password for sam:</text><text x="14" y="84" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fff" xml:space="preserve">sam@PC:~$ curl -fsSL .../tilt/master/scripts/install.sh | bash</text><text x="14" y="104" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fff" xml:space="preserve">Tilt installed</text><text x="14" y="124" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fff" xml:space="preserve">sam@PC:~$ node --version</text><text x="14" y="144" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fff" xml:space="preserve">v22.12.0</text><text x="14" y="164" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fff" xml:space="preserve">sam@PC:~$ tilt version</text><text x="14" y="184" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fff" xml:space="preserve">v0.3x.x, built ...</text><text x="14" y="204" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fff" xml:space="preserve">sam@PC:~$ git --version</text><text x="14" y="224" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fff" xml:space="preserve">git version 2.4x.x</text>
<text x="630" y="256" text-anchor="end" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="10" fill="#707070">Illustration, not a real screenshot</text>
</svg>
