<svg xmlns="http://www.w3.org/2000/svg" width="640" height="190" viewBox="0 0 640 190" role="img" aria-label="PowerShell window titled Administrator: Windows PowerShell with the command wsl --install -d Ubuntu">
<title>PowerShell window titled Administrator: Windows PowerShell with the command wsl --install -d Ubuntu</title>
<rect width="640" height="190" fill="#f3f3f3" stroke="#9a9a9a"/>
<rect width="640" height="190" fill="#012456"/><rect width="640" height="30" fill="#2b2b2b"/><text x="12" y="20" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="12" fill="#ffffff">Administrator: Windows PowerShell</text><text x="560" y="21" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="14" fill="#ffffff">–   ☐   ✕</text><text x="14" y="44" font-family="Consolas,Menlo,monospace" font-size="13" fill="#ffffff" xml:space="preserve">PS C:\WINDOWS\system32&gt; wsl --install -d Ubuntu</text><text x="14" y="64" font-family="Consolas,Menlo,monospace" font-size="13" fill="#f0f0f0" xml:space="preserve">Installing: Ubuntu</text><text x="14" y="84" font-family="Consolas,Menlo,monospace" font-size="13" fill="#f0f0f0" xml:space="preserve">Ubuntu has been installed.</text><text x="14" y="104" font-family="Consolas,Menlo,monospace" font-size="13" fill="#f0f0f0" xml:space="preserve">The requested operation is successful. Restart your computer if asked.</text><text x="14" y="124" font-family="Consolas,Menlo,monospace" font-size="13" fill="#ffffff" xml:space="preserve">PS C:\WINDOWS\system32&gt; _</text>
