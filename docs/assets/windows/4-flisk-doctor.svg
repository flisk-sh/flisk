<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="Ubuntu terminal running flisk doctor">
<title>Ubuntu terminal running flisk doctor</title>
<rect width="640" height="230" fill="#f3f3f3" stroke="#9a9a9a"/>
<rect width="640" height="230" fill="#300a24"/><rect width="640" height="30" fill="#2b2b2b"/><text x="12" y="20" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="12" fill="#ffffff">Ubuntu</text><text x="560" y="21" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="14" fill="#ffffff">–   ☐   ✕</text><text x="14" y="44" font-family="Consolas,Menlo,monospace" font-size="13" fill="#ffffff" xml:space="preserve">sam@PC:~$ npx @flisk-sh/flisk doctor</text><text x="14" y="64" font-family="Consolas,Menlo,monospace" font-size="13" fill="#8ae234" xml:space="preserve">✅ Docker daemon is running</text><text x="14" y="84" font-family="Consolas,Menlo,monospace" font-size="13" fill="#8ae234" xml:space="preserve">✅ Tilt is available</text><text x="14" y="104" font-family="Consolas,Menlo,monospace" font-size="13" fill="#8ae234" xml:space="preserve">✅ git core.autocrlf is not true</text><text x="14" y="124" font-family="Consolas,Menlo,monospace" font-size="13" fill="#ef2929" xml:space="preserve">❌ Docker WSL integration: Docker does not answer from this WSL2</text><text x="14" y="144" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fce94f" xml:space="preserve">   distribution. Fix: Docker Desktop → Settings → Resources →</text><text x="14" y="164" font-family="Consolas,Menlo,monospace" font-size="13" fill="#fce94f" xml:space="preserve">   WSL Integration → turn it on for Ubuntu → Apply &amp; Restart</text>
<text x="630" y="222" text-anchor="end" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="10" fill="#707070">Illustration, not a real screenshot</text>
