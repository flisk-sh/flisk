<svg xmlns="http://www.w3.org/2000/svg" width="722" height="100" viewBox="0 0 722 100" role="img" aria-label="Flisk is building your app: API, website, worker, AI agent, MCP tools and Postgres">
  <defs>
    <linearGradient id="bolt" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0" stop-color="#5ee0a0"/>
      <stop offset="1" stop-color="#1f9d6b"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee0a0" stop-opacity="0"/>
      <stop offset="1" stop-color="#5ee0a0" stop-opacity=".6"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #24292f; }
    .title { font-size: 14px; font-weight: 700; fill: #1f9d6b; }
    .sub { font-size: 11px; fill: #6e7781; }
    .part { font-size: 13px; fill: #24292f; font-weight: 600; opacity: 0; animation: part 9.6s linear infinite; }
    .p1 { animation-delay: 0s; } .p2 { animation-delay: 1.6s; } .p3 { animation-delay: 3.2s; }
    .p4 { animation-delay: 4.8s; } .p5 { animation-delay: 6.4s; } .p6 { animation-delay: 8s; }
    @keyframes part {
      0% { opacity: 0; transform: translateY(4px); }
      4% { opacity: 1; transform: translateY(0); }
      14% { opacity: 1; }
      18%, 100% { opacity: 0; }
    }
    .ring { fill: none; stroke: #1f9d6b; stroke-opacity: .25; stroke-width: 1; }
    .axis { stroke: #1f9d6b; stroke-opacity: .2; stroke-width: 1; }
    .arm { transform-box: view-box; transform-origin: 600px 50px; animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blip { fill: #5ee0a0; opacity: 0; animation: blip 3s ease-out infinite; }
    .tag { font-size: 9px; fill: #1f9d6b; opacity: 0; animation: blip 3s ease-out infinite; }
    .b1 { animation-delay: .35s; } .b2 { animation-delay: .9s; } .b3 { animation-delay: 1.5s; } .b4 { animation-delay: 2.1s; }
    @keyframes blip {
      0%, 8% { opacity: 0; }
      12%, 40% { opacity: 1; }
      60%, 100% { opacity: 0; }
    }
    .core { animation: pulse 1.5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { from { transform: scale(.94); } to { transform: scale(1.06); } }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .sub { fill: #8b949e; }
      .title { fill: #5ee0a0; }
      .tag { fill: #5ee0a0; }
    }
  </style>

  <!-- Left: a headline, and the parts Flisk builds, one at a time in the same slot -->
  <text x="24" y="30" class="title">Building your app<tspan class="cursor"> _</tspan></text>
  <text x="24" y="50" class="part p1">API · orders-api</text>
  <text x="24" y="50" class="part p2">website · React, Vue or Svelte</text>
  <text x="24" y="50" class="part p3">background worker</text>
  <text x="24" y="50" class="part p4">AI agent · checkpoints</text>
  <text x="24" y="50" class="part p5">MCP tools for your AI</text>
  <text x="24" y="50" class="part p6">Postgres · migrations</text>
  <text x="24" y="72" class="sub">one service.json per part · hot reload · one URL</text>

  <!-- Right: a radar. Each blip is a part being found and wired, tagged by name -->
  <circle cx="600" cy="50" r="44" class="ring"/>
  <circle cx="600" cy="50" r="29" class="ring"/>
  <circle cx="600" cy="50" r="14" class="ring"/>
  <line x1="556" y1="50" x2="644" y2="50" class="axis"/>
  <line x1="600" y1="6" x2="600" y2="94" class="axis"/>
  <g class="arm">
    <path d="M600 50 L644 50 A44 44 0 0 0 614.9 8.4 Z" fill="url(#sweep)"/>
    <line x1="600" y1="50" x2="644" y2="50" stroke="#5ee0a0" stroke-width="1.5"/>
  </g>
  <circle class="blip b1" cx="622" cy="26" r="2.5"/>
  <text class="tag b1" x="629" y="29">api</text>
  <circle class="blip b2" cx="576" cy="38" r="2.5"/>
  <text class="tag b2" x="536" y="41">web</text>
  <circle class="blip b3" cx="618" cy="72" r="2.5"/>
  <text class="tag b3" x="625" y="75">worker</text>
  <circle class="blip b4" cx="578" cy="66" r="2.5"/>
  <text class="tag b4" x="536" y="69">agent</text>
  <g class="core">
    <path d="M600 36 591 52h7l-4 12 11-17h-7z" fill="url(#bolt)" stroke="#16805a" stroke-width=".8" stroke-linejoin="round"/>
  </g>
</svg>
