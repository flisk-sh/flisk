<svg xmlns="http://www.w3.org/2000/svg" width="960" height="286" viewBox="0 0 960 286" role="img" aria-labelledby="title desc">
  <title id="title">Animated TDK MCP tool icon demo</title>
  <desc id="desc">Four dark cards with gently animated Doctor, Up, Status, and Logs icons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#192b3d"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#61f0d3"/><stop offset="1" stop-color="#69a8ff"/></linearGradient>
    <style>
      .card{fill:#111d2b;stroke:#2d4358;stroke-width:1.5}.title{font:650 19px system-ui,sans-serif;fill:#edf5ff}.sub{font:13px system-ui,sans-serif;fill:#91a8bf}.ic{fill:none;stroke:url(#glow);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#61f0d3}
      .heart{stroke-dasharray:100;stroke-dashoffset:100;animation:trace 2.2s ease-in-out infinite}.beat{transform-origin:120px 104px;animation:beat 1.7s ease-in-out infinite}.rise{animation:rise 1.8s ease-in-out infinite}.spin{transform-origin:600px 104px;animation:spin 8s linear infinite}.log{animation:log 1.7s ease-in-out infinite}.log2{animation-delay:.2s}.log3{animation-delay:.4s}.pulse{animation:pulse 1.5s ease-in-out infinite}
      @keyframes trace{0%{stroke-dashoffset:100;opacity:.45}50%,78%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-100;opacity:.45}}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}@keyframes rise{0%,100%{transform:translateY(5px);opacity:.7}50%{transform:translateY(-5px);opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes log{0%,100%{opacity:.45;transform:translateX(-3px)}50%{opacity:1;transform:translateX(3px)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
    </style>
  </defs>
  <rect width="960" height="286" rx="24" fill="url(#bg)"/>
  <text x="30" y="38" class="sub" style="font-weight:700;letter-spacing:2px">TDK MCP / TOOL MOTION STUDY</text>
  <g><rect class="card" x="24" y="58" width="216" height="202" rx="18"/><g class="beat"><circle cx="120" cy="104" r="33" fill="#153040" stroke="#315469"/><path class="ic heart" d="M91 105h12l8-16 11 31 9-21 7 6h13"/></g><text x="46" y="177" class="title">Doctor</text><text x="46" y="204" class="sub">Host checks</text><circle class="dot pulse" cx="207" cy="178" r="4"/></g>
  <g><rect class="card" x="264" y="58" width="216" height="202" rx="18"/><g class="rise"><circle cx="360" cy="104" r="33" fill="#153040" stroke="#315469"/><path class="ic" d="M360 122V86m-14 14 14-14 14 14"/><path d="M343 125h34" stroke="#61f0d3" stroke-width="3" stroke-linecap="round"/></g><text x="286" y="177" class="title">Up</text><text x="286" y="204" class="sub">Start services</text><path d="M448 178h10" stroke="#61f0d3" stroke-width="4" stroke-linecap="round"><animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/></path></g>
  <g><rect class="card" x="504" y="58" width="216" height="202" rx="18"/><g class="spin" fill="none" stroke="#61f0d3" stroke-width="3"><circle cx="600" cy="104" r="39" stroke-dasharray="2 12"/><circle cx="600" cy="104" r="47" stroke-dasharray="1 18" opacity=".45"/></g><circle cx="600" cy="104" r="5" fill="#61f0d3" class="pulse"/><text x="526" y="177" class="title">Status</text><text x="526" y="204" class="sub">Readiness pulse</text><circle cx="687" cy="178" r="4" fill="#61f0d3"><animate attributeName="r" values="2;5;2" dur="1.4s" repeatCount="indefinite"/></circle></g>
  <g><rect class="card" x="744" y="58" width="192" height="202" rx="18"/><g><path class="ic log" d="M794 91h46"/><path class="ic log log2" d="M794 104h34"/><path class="ic log log3" d="M794 117h40"/><circle cx="784" cy="91" r="2" fill="#61f0d3"/><circle cx="784" cy="104" r="2" fill="#61f0d3"/><circle cx="784" cy="117" r="2" fill="#61f0d3"/></g><text x="766" y="177" class="title">Logs</text><text x="766" y="204" class="sub">Recent output</text><circle cx="903" cy="178" r="4" fill="#61f0d3" class="pulse"/></g>
</svg>
