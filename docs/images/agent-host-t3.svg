<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Flisk from a T3-style server</title>
  <desc id="desc">The client talks to the server. The agent on the server calls flisk up. Docker runs the services as sibling containers.</desc>
  <style>
    text { font: 13px ui-sans-serif, sans-serif; fill: #e8eef7 }
    .box { fill: #121826; stroke: #2c3b55 }
    .pulse { stroke: #7dd3c7; stroke-width: 2; fill: none; stroke-dasharray: 6 6;
             animation: flow 1.4s linear infinite }
    @keyframes flow { to { stroke-dashoffset: -24 } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none } }
  </style>
  <rect width="760" height="220" rx="12" fill="#0b1020"/>
  <g class="box"><rect x="24" y="36" width="150" height="64" rx="8"/><text x="40" y="64">Client (browser)</text><text x="40" y="84">no repo, no flisk</text></g>
  <g class="box"><rect x="230" y="36" width="160" height="64" rx="8"/><text x="246" y="64">Server</text><text x="246" y="84">owns the repo</text></g>
  <g class="box"><rect x="446" y="36" width="150" height="64" rx="8"/><text x="462" y="64">Agent</text><text x="462" y="84">flisk up --json</text></g>
  <g class="box"><rect x="230" y="140" width="280" height="52" rx="8"/><text x="246" y="170">Host Docker: Traefik + services</text></g>
  <path class="pulse" d="M174 68 H230 M390 68 H446 M521 100 V140 H510"/>
</svg>
