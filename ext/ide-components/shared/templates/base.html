<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{title} - TDK Tilt IDE</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{favicon}</text></svg>">
  <script>
    // Theme initialization - runs before page renders to prevent flash
    (function() {{
      const savedTheme = localStorage.getItem('tilt-ide-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      if (theme === 'light') {{
        document.documentElement.setAttribute('data-theme', 'light');
      }}
    }})();
    
    // Handle unavailable IDE services
    document.addEventListener('DOMContentLoaded', function() {
      const links = [
        { id: 'filesLink', name: 'File Browser', port: 9765 },
        { id: 'viewerLink', name: 'Code Viewer', port: 9766 },
        { id: 'terminalLink', name: 'Terminal', port: 9768 }
      ];
      
      links.forEach(function(link) {
        const el = document.getElementById(link.id);
        if (!el) return;
        
        const isAvailable = el.getAttribute('data-available') === 'true';
        
        if (!isAvailable) {
          el.style.opacity = '0.5';
          el.style.cursor = 'not-allowed';
          el.title = link.name + ' not running (port ' + link.port + ')';
          
          el.addEventListener('click', function(e) {
            e.preventDefault();
            showServiceUnavailable(link.name, link.port);
          });
        }
      });
    });
    
    function showServiceUnavailable(name, port) {
      const existing = document.querySelector('.notification-toast');
      if (existing) existing.remove();
      
      const toast = document.createElement('div');
      toast.className = 'notification-toast warning';
      toast.innerHTML = '<strong>' + name + ' not running</strong><br>Start it with: <code>tilt up ' + name.toLowerCase().replace(' ', '-') + '</code> (port ' + port + ')';
      document.body.appendChild(toast);
      
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
  </script>
</head>
<body>
  <header class="header">
    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
      ☰
    </button>
    <h1>
      <span class="header-icon">{icon}</span>
      {title}
    </h1>
    <nav class="nav">
      <a href="//localhost:9765" class="{active_browser}" id="filesLink" data-available="{files_available}">📁 Files</a>
      <a href="//localhost:9766" class="{active_viewer}" id="viewerLink" data-available="{viewer_available}">👁️ Code</a>
      <a href="//localhost:9767" class="{active_inspector}">⚙️ Configs</a>
      <a href="//localhost:9768" class="{active_terminal}" id="terminalLink" data-available="{terminal_available}">💻 Terminal</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
      🌓
    </button>
    {controls}
  </header>
  
  <div class="container" id="mainContainer">
    {sidebar}
    <main class="content">
      {content}
    </main>
  </div>
  
  <script>
    // Theme toggle functionality
    (function() {{
      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {{
        themeToggle.addEventListener('click', function() {{
          const currentTheme = document.documentElement.getAttribute('data-theme');
          const newTheme = currentTheme === 'light' ? 'dark' : 'light';
          if (newTheme === 'light') {{
            document.documentElement.setAttribute('data-theme', 'light');
          }} else {{
            document.documentElement.removeAttribute('data-theme');
          }}
          localStorage.setItem('tilt-ide-theme', newTheme);
        }});
      }}
      
      // Mobile menu toggle
      const mobileMenuToggle = document.getElementById('mobileMenuToggle');
      const container = document.getElementById('mainContainer');
      if (mobileMenuToggle && container) {{
        mobileMenuToggle.addEventListener('click', function() {{
          container.classList.toggle('sidebar-open');
        }});
      }}
    }})();
  </script>
  {scripts}
</body>
</html>
